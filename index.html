<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find your course · Swift AI Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13205E;--ink:#1A2140;--muted:#5A6386;--blue:#3B5BFD;--blue-soft:#E1E5F0;--amber:#F5A524;
  --paper:#F2F3F7;--card:#FBFAF7;--line:#DCE2F2;--ok:#1E8E5A;--warn-bg:#F1E6CF;--notice:#F6F1E1;
  --bubble:#DFE9DC;--on-navy:#FFFFFF;--on-navy-muted:#B9C3F0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0E1640;--ink:#E8ECFA;--muted:#A3ACCF;--blue:#7C93FF;--blue-soft:#1F2A5E;--paper:#0B1030;--card:#151C45;
  --line:#2A3466;--warn-bg:#3A2E12;--notice:#2B2914;--bubble:#173A2A;}}
:root[data-theme="dark"]{--navy:#0E1640;--ink:#E8ECFA;--muted:#A3ACCF;--blue:#7C93FF;--blue-soft:#1F2A5E;--paper:#0B1030;--card:#151C45;
  --line:#2A3466;--warn-bg:#3A2E12;--notice:#2B2914;--bubble:#173A2A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55}
body[data-lang="hi"]{font-family:"Noto Sans Devanagari","Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;line-height:1.65}
body[data-lang="hi"] h1,body[data-lang="hi"] h2,body[data-lang="hi"] h3{letter-spacing:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{background:var(--navy);color:var(--on-navy);padding:18px 20px 22px}
.top-in{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}
.logo{display:inline-flex;align-items:center;gap:10px;color:#fff}
.logo-icon{flex:none}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-name{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em}
.logo-sub{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.42em;color:#A9B3D9;margin-top:5px}
/* language switch */
.lang{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:3px;flex:none}
.lang button{min-height:40px;min-width:64px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:var(--on-navy);font-weight:700;font-size:15px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#F2F3F7;color:#13205E}
.lang .hi{font-family:"Noto Sans Devanagari",sans-serif}

.bar{display:flex;gap:5px;margin-top:18px}
.bar span{flex:1;height:6px;border-radius:2px;background:rgba(255,255,255,.18)}
.bar span.done{background:var(--amber)}
.stepline{font-size:14px;color:var(--on-navy-muted);margin-top:8px;min-height:1.4em}
main{max-width:640px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:clamp(28px,6vw,36px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:clamp(22px,5vw,27px);line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.help{color:var(--muted);margin:0 0 20px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr}
@media (min-width:520px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px 16px;background:var(--card);
  border:2px solid var(--line);border-radius:6px;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt .tick{flex:none;width:22px;height:22px;border:2px solid var(--line);display:grid;place-items:center}
.opt[data-kind="single"] .tick{border-radius:50%}
.opt[data-kind="multi"] .tick{border-radius:2px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .tick{background:var(--blue);border-color:var(--blue)}
.opt[aria-pressed="true"] .tick::after{content:"";width:8px;height:8px;background:var(--card);border-radius:2px}
.opt[data-kind="single"][aria-pressed="true"] .tick::after{border-radius:50%}
.nav{display:flex;gap:12px;margin-top:28px}
.btn{min-height:52px;padding:0 24px;border-radius:6px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.btn.primary{flex:1;background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:14px;color:var(--muted);margin-top:10px;min-height:1.4em}
.promises{display:grid;gap:10px;margin:22px 0 26px;padding:0;list-style:none}
.promises li{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.promises b{display:block}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.examples span{font-size:14px;font-weight:600;padding:5px 12px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
/* situations */
.scene{margin:0 0 20px}
.phone{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;max-width:420px}
.phone .who{font-size:13px;color:var(--muted);margin:0 0 8px 4px}
.bubble{background:var(--bubble);border-radius:2px 6px 6px 6px;padding:12px 14px;font-size:16px}
.bubble small{display:block;text-align:right;color:var(--muted);font-size:12px;margin-top:4px}
.ai-q{background:var(--blue);color:#fff;border-radius:6px 2px 6px 6px;padding:10px 14px;margin:0 0 10px auto;width:fit-content;max-width:85%}
.ai-a{background:var(--blue-soft);border-radius:2px 6px 6px 6px;padding:10px 14px;max-width:85%}
.notice{background:var(--notice);border:1px solid #E9D98A;border-radius:4px;padding:20px 22px;max-width:420px;
  font-family:Georgia,"Times New Roman",serif}
.notice strong{display:block;text-align:center;letter-spacing:.08em;margin-bottom:8px}
.note{font-size:14px;color:var(--muted);margin-top:10px}
/* results */
.plan-head{margin-bottom:20px}
.start{background:var(--navy);color:var(--on-navy);border-radius:6px;padding:22px}
.start .lbl{color:var(--amber);font-weight:700;font-size:15px}
.start h3{font-size:24px;line-height:1.25;margin:6px 0 10px}
.start .why{background:rgba(255,255,255,.08);border-radius:6px;padding:14px;margin-top:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:600}
.meta span{padding:4px 10px;border-radius:6px;background:var(--blue-soft);color:var(--ink)}
.start .meta span{background:rgba(255,255,255,.14);color:#fff}
.meta .after{background:var(--warn-bg)}
.sec{font-size:18px;margin:28px 0 12px}
.course{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:12px}
.course h3{font-size:19px;margin:8px 0 6px;line-height:1.3}
.course p{margin:8px 0 0;color:var(--muted)}
.course .cta,.start .cta{margin-top:14px;min-height:46px;padding:0 18px;border-radius:6px;border:0;background:var(--amber);color:#1A2140;font-weight:700;cursor:pointer}
.course .cta{background:var(--blue-soft);color:var(--ink)}
.understood{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 18px}
.understood div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.understood div:last-child{border-bottom:0}
.understood span:first-child{color:var(--muted)}
.understood span:last-child{text-align:right;font-weight:600}
details.staff{margin-top:24px;font-size:14px;background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:12px 16px}
details.staff summary{cursor:pointer;font-weight:600}
details.staff code{font-size:13px}
.level{display:flex;gap:4px;align-items:center;margin-top:6px}
.level i{width:22px;height:7px;border-radius:2px;background:var(--line)}
.level i.on{background:var(--blue)}
.foot{max-width:640px;margin:0 auto;padding:0 20px 32px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:var(--muted);text-underline-offset:3px}
.toast{font-size:14px;color:var(--ok);margin-top:8px;min-height:1.2em}
.start .toast{color:#9BE3BF}
@media (max-width:380px){.logo-name{font-size:19px}.lang button{min-width:56px;padding:0 10px}}
</style>
</head>

<script>
/* ---------- language ---------- */
let LANG="en";
try{const s=localStorage.getItem("saa-lang");if(s==="hi"||s==="en")LANG=s;}catch(e){}
// tr: pick the current language from {en,hi}; plain strings pass through
const tr=x=>x&&typeof x==="object"&&!Array.isArray(x)?(x[LANG]??x.en):x;
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(_,k)=>v[k]??"");

const UI={
  minutes:{en:"About 3 minutes",hi:"लगभग 3 मिनट"},
  wH1:{en:"Let us find the right course for you",hi:"आइए आपके लिए सही कोर्स खोजें"},
  wHelp:{en:"Answer 10 short questions. We will show you one course to start today, and what to learn next.",
         hi:"10 छोटे सवालों के जवाब दें। हम आपको आज शुरू करने के लिए एक कोर्स दिखाएँगे, और आगे क्या सीखना है।"},
  p1b:{en:"This is not an exam",hi:"यह परीक्षा नहीं है"},p1:{en:"There are no marks. Every answer is fine.",hi:"कोई नंबर नहीं हैं। हर जवाब ठीक है।"},
  p2b:{en:"Tell us what you have done",hi:"बताइए आपने क्या-क्या किया है"},p2:{en:"We ask what you have actually done on a phone, a computer and at work.",hi:"हम पूछते हैं कि आपने फ़ोन, कंप्यूटर और काम पर असल में क्या-क्या किया है।"},
  p3b:{en:"You can go back",hi:"आप पीछे जा सकते हैं"},p3:{en:"Change any answer before you see your plan.",hi:"अपना प्लान देखने से पहले कोई भी जवाब बदल सकते हैं।"},
  startQ:{en:"Start the questions",hi:"सवाल शुरू करें"},
  qOf:{en:"Question {n} of {m}",hi:"सवाल {n} / {m}"},

  max:{en:"You can pick up to {n}. Tap one again to remove it.",hi:"आप {n} तक चुन सकते हैं। हटाने के लिए उसे फिर से दबाएँ।"},
  examples:{en:"Examples",hi:"उदाहरण"},
  ready:{en:"Your plan is ready",hi:"आपका प्लान तैयार है"},
  rH1:{en:"Here is your learning plan",hi:"यह रहा आपका सीखने का प्लान"},
  rHelp:{en:"We matched your answers to what each course needs and teaches. Start with the first course today.",

  startHere:{en:"Start here",hi:"यहाँ से शुरू करें"},next:{en:"Next",hi:"इसके बाद"},alsoLike:{en:"You may also like",hi:"आपको यह भी पसंद आ सकता है"},
  understood:{en:"What we understood about you",hi:"हमने आपके बारे में क्या समझा"},
  hours:{en:"{h} hours",hi:"{h} घंटे"},after:{en:"After {x}",hi:"{x} के बाद"},
  startCourse:{en:"Start this course",hi:"यह कोर्स शुरू करें"},addPlan:{en:"Add to my plan",hi:"मेरे प्लान में जोड़ें"},saveLater:{en:"Save for later",hi:"बाद के लिए सहेजें"},

  tAdded:{en:"Added to your plan.",hi:"आपके प्लान में जोड़ दिया।"},
  tOpening:{en:"Opening the course…",hi:"कोर्स खुल रहा है…"},
  change:{en:"Change my answers",hi:"मेरे जवाब बदलें"},again:{en:"Start again",hi:"फिर से शुरू करें"},
  kTrade:{en:"Trade",hi:"ट्रेड"},kGoals:{en:"Goals",hi:"लक्ष्य"},kStudies:{en:"Studies",hi:"पढ़ाई"},kPhone:{en:"Phone",hi:"फ़ोन"},
  kComp:{en:"Computer",hi:"कंप्यूटर"},kAI:{en:"AI apps",hi:"AI ऐप्स"},kEng:{en:"English at work",hi:"काम पर अंग्रेज़ी"},

  terms:{en:"Terms of Service",hi:"सेवा की शर्तें"},privacy:{en:"Privacy Policy",hi:"गोपनीयता नीति"}

const t=(k,v)=>fill(tr(UI[k]),v||{});

/* ---------- courses ---------- */
// Every "Start this course" button opens the live course in a new tab.
const LIVE_URL="https://aai-tau.vercel.app/#S01";
const COURSES = {
  AIFS:{name:"AI First Steps on Your Phone",cat:{en:"AI Foundations",hi:"AI की बुनियाद"},h:8,rung:1,teaches:["web_search","ai_aware","file_sharing","phone_typing"],
    needs:[],promise:{en:"It starts from zero and uses only your phone.",hi:"यह बिल्कुल शुरू से है और सिर्फ़ आपके फ़ोन से चलता है।"}},
  EAB:{name:"Everyday AI Basics",cat:{en:"AI Foundations",hi:"AI की बुनियाद"},h:10,rung:2,teaches:["ai_first_use","online_forms","email_use"],
    needs:["phone_typing"],needsAny:["web_search","file_sharing"],promise:{en:"You will use an AI app for small daily tasks, step by step.",hi:"आप रोज़ के छोटे कामों के लिए AI ऐप का इस्तेमाल कदम-दर-कदम सीखेंगे।"}},
  AA1:{name:"Applied AI 1: Use It, and Check It",cat:{en:"Applied AI",hi:"काम में AI"},h:16,rung:3,teaches:["ai_first_use","ai_prompting","ai_verification"],
    needs:["phone_typing","web_search"],promise:{en:"You will use an AI app on real tasks and check every answer.",hi:"आप असली कामों में AI ऐप का इस्तेमाल करेंगे और हर जवाब जाँचेंगे।"}},
  AA2:{name:"Applied AI 2: Apply It Where It Matters",cat:{en:"Applied AI",hi:"काम में AI"},h:16,rung:3,teaches:["ai_task_use"],
    needs:["ai_prompting","ai_verification"],promise:{en:"You will use AI for real work and study tasks.",hi:"आप काम और पढ़ाई के असली कामों में AI का इस्तेमाल करेंगे।"}},
  AA3:{name:"Applied AI 3: Trust, Safety and Harm",cat:{en:"Applied AI",hi:"काम में AI"},h:16,rung:4,teaches:["ai_safety"],

    needs:["computer_basics","spreadsheet","ai_prompting"],promise:{en:"You will write simple Python to work with data.",hi:"आप डेटा के साथ काम करने के लिए आसान Python लिखेंगे।"}},

  COM1:{name:"Basic and Foundational Workplace Communication",cat:{en:"Communication",hi:"बातचीत"},h:58,teaches:["eng_basic","eng_reading"],

/* ---------- engine (unchanged logic) ---------- */
function skillsFrom(a){
  const s=new Set(), ph=a.phone||[], pc=a.computer||[];
  if(ph.includes("msg"))s.add("phone_typing"); if(ph.includes("pdf"))s.add("file_sharing");
  if(ph.includes("search"))s.add("web_search"); if(ph.includes("form"))s.add("online_forms"); if(ph.includes("email"))s.add("email_use");
  if(pc.some(x=>x!=="none"))s.add("computer_basics"); if(pc.includes("sheet"))s.add("spreadsheet"); if(pc.includes("code"))s.add("coding");
  const used=a.aiUse&&a.aiUse!=="never", often=["month","week"].includes(a.aiUse);
  if(used){s.add("ai_aware");s.add("ai_first_use");}
  if(often)s.add("ai_prompting");
  if(used&&a.aiCheck==="check")s.add("ai_verification");
  if(often&&a.aiCheck==="check")s.add("ai_task_use");
  if(a.aiUse==="week"&&a.aiCheck==="check"&&a.scam==="check")s.add("ai_safety");
  if(a.aiUse==="week"&&a.aiCheck==="check"&&a.scam==="check")s.add("ai_method");
  if(["many","few"].includes(a.intro))s.add("eng_basic");
  if(a.notice==="tue")s.add("eng_reading");
  return s;
}
const RUNGS=[[1,["phone_typing","file_sharing","web_search","ai_aware"]],[2,["ai_first_use","online_forms","email_use"]],
  [3,["ai_first_use","ai_prompting","ai_verification"]],[4,["ai_safety","ai_method"]]];
function aiLevel(s){for(const [r,k] of RUNGS){if(k.filter(x=>s.has(x)).length/k.length<0.6)return r;}return 5;}
function ready(id,s,a){const c=COURSES[id];
  if(!c.needs.every(x=>s.has(x)))return false;
  if(c.needsAny&&!c.needsAny.some(x=>s.has(x)))return false;
  if(id==="PY"&&!(["c12","dip"].includes(a.education)||a.trade==="copa"))return false;
  return true;}
function known(id,s){return COURSES[id].teaches.every(x=>s.has(x));}
function risks(a){return{scam:a.scam&&a.scam!=="check",unchecked:["month","week"].includes(a.aiUse)&&a.aiCheck==="use"};}

function recommend(a){
  const s=skillsFrom(a), lvl=aiLevel(s), r=risks(a), goals=(a.goals||[]);
  const g=goals.filter(x=>x!=="notsure"); const goal=g[0]||"notsure";
  const has=x=>goals.includes(x);
  const later=new Set(s), plan={start:null,next:[],later:[]}, used=new Set();
  // 1. Start: always an AI course matched to level
  const LADDER=["AIFS","EAB","AA1","AA3","AA4"];
  let start=null;
  if(lvl===5&&has("tech")&&ready("PY",s,a))start="PY";
  for(const id of LADDER.slice(Math.min(lvl,5)-1)){if(start)break;if(ready(id,s,a)&&!known(id,s))start=id;}
  if(!start)start=ready("PY",s,a)?"PY":"AA4";
  plan.start=start;used.add(start);COURSES[start].teaches.forEach(x=>later.add(x));
  // 2. Next: follow-on on the AI ladder
  const follow={AIFS:"EAB",EAB:"AA1",AA1:(r.scam||r.unchecked)?"AA3":"AA2",AA2:"AA3",AA3:"AA4",AA4:has("tech")?"BOT":null,PY:"BOT"}[start];
  if(follow&&ready(follow,later,a)&&!known(follow,s)){plan.next.push({id:follow,after:start});used.add(follow);}
  // 3. Next: one course from another area, only if goals need it
  const engGoal=g.some(x=>["govt","private","tech"].includes(x));
  let par=null;
  if(engGoal&&(!s.has("eng_basic")||!s.has("eng_reading")))par="COM1";
  else if((has("govt")||has("private"))&&!s.has("interview_skills"))par="IGD";
  else if(has("tech")&&!used.has("PY")&&ready("PY",s,a))par="PY";
  else if(has("tech")&&!used.has("BOT")&&ready("BOT",later,a))par="BOT";
  else if(has("trade")&&s.has("eng_basic"))par="TTC";
  else if(has("tech")&&ready("WWE",s,a))par="WWE";
  if(par&&!used.has(par)){plan.next.push({id:par});used.add(par);}
  // 4. Later: safety raised when answers show risk; tech learners see bot building
  if((r.scam||r.unchecked)&&!used.has("AA3"))plan.later.push({id:"AA3",after:"AA1"});
  if(has("tech")&&!used.has("BOT")&&plan.later.length<2)plan.later.push({id:"BOT",after:ready("BOT",later,a)?null:start});
  if(!plan.later.length){const nx={AIFS:"AA1",EAB:"AA1",AA1:"AA3",AA2:"AA3",AA3:"AA4"}[plan.next[0]?.id||start];
    if(nx&&!used.has(nx))plan.later.push({id:nx,after:plan.next[0]?.id||start});}
  // reasons, in the current language
  const why=(id,role,after)=>{const c=COURSES[id];const out=[];
    const base=after?later:s; const gap=c.teaches.find(x=>!base.has(x));
    if(id==="AA3"&&r.scam)out.push(tr(WHY.scam));
    else if(id==="AA3"&&r.unchecked)out.push(tr(WHY.unchecked));
    else if(gap&&GAP[gap])out.push(goal==="notsure"?sentence(tr(GAP[gap])):fill(tr(WHY.goal),{g:tr(GOAL_PHRASE[goal]),gap:tr(GAP[gap])}));
    if(role==="start"&&c.rung)out.push(tr(WHY.first));
    if(role==="next"&&after)out.push(fill(tr(WHY.follows),{x:COURSES[after].name}));
    if(role==="later"&&after)out.push(fill(tr(WHY.takeAfter),{x:COURSES[after].name}));
    out.push(tr(c.promise));return out.join(" ");};
  return{skills:[...s],level:lvl,risks:r,
    start:{id:start,why:why(start,"start")},
    next:plan.next.map(n=>({id:n.id,after:n.after||null,why:why(n.id,"next",n.after)})),
    later:plan.later.map(n=>({id:n.id,after:n.after||null,why:why(n.id,"later",n.after)}))};
}
function sentence(x){return LANG==="hi"?x+"।":x[0].toUpperCase()+x.slice(1)+".";}

const SCENES={
 ai:()=>`<div class="scene"><div class="phone" aria-label="${esc(tr(SC.aiLbl))}">
   <div class="ai-q">${esc(tr(SC.aiQ))}</div>
   <div class="ai-a">${esc(tr(SC.aiA))}</div></div></div>`,
 scam:()=>`<div class="scene"><div class="phone" aria-label="${esc(tr(SC.msgLbl))}">
   <p class="who">+91 98xxx xxx21 &nbsp;${esc(tr(SC.who))}</p>
   <div class="bubble">${esc(tr(SC.msg))}<small>${esc(tr(SC.time))}</small></div></div></div>`,
 notice:()=>`<div class="scene"><div class="notice" lang="en" role="img" aria-label="Notice in English: The workshop will be closed on Monday. Please bring your ID card on Tuesday.">
   <strong>NOTICE</strong>The workshop will be closed on Monday. Please bring your ID card on Tuesday.</div>
   <p class="note">${esc(tr(SC.note))}</p></div>`
};
const LABELS={trade:{},goals:{},education:{}};
QUESTIONS.forEach(q=>{if(LABELS[q.id])q.opts.forEach(([v,l])=>LABELS[q.id][v]=l)});

/* ---------- screens ---------- */
let step=-1; const answers={}; const app=document.getElementById("app");
const N=QUESTIONS.length;
document.getElementById("bar").innerHTML=QUESTIONS.map(()=>"<span></span>").join("");
function setBar(done,label){[...document.querySelectorAll("#bar span")].forEach((s,i)=>s.classList.toggle("done",i<done));
  document.getElementById("stepline").textContent=label;}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function setLang(l){
  LANG=l; document.documentElement.lang=l; document.body.dataset.lang=l;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  document.getElementById("fTerms").textContent=t("terms");document.getElementById("fPriv").textContent=t("privacy");
  try{localStorage.setItem("saa-lang",l);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  if(b.dataset.lang===LANG)return; const y=window.scrollY; setLang(b.dataset.lang); render(); window.scrollTo(0,y);});

function welcome(){setBar(0,t("minutes"));
  app.innerHTML=`<section class="screen"><h1>${esc(t("wH1"))}</h1>
  <p class="help">${esc(t("wHelp"))}</p>
  <ul class="promises"><li><b>${esc(t("p1b"))}</b>${esc(t("p1"))}</li>
  <li><b>${esc(t("p2b"))}</b>${esc(t("p2"))}</li>
  <li><b>${esc(t("p3b"))}</b>${esc(t("p3"))}</li></ul>
  <div class="nav"><button class="btn primary" id="go">${esc(t("startQ"))}</button></div></section>`;
  document.getElementById("go").onclick=()=>{step=0;render();};}

function isAnswered(q){const v=answers[q.id];return q.type==="multi"?Array.isArray(v)&&v.length>0:!!v;}
function render(){
  if(step<0)return welcome(); if(step>=N)return results();
  const q=QUESTIONS[step]; setBar(step,t("qOf",{n:step+1,m:N}));
  const sel=answers[q.id]||(q.type==="multi"?[]:null);
  app.innerHTML=`<section class="screen" aria-labelledby="qh">
   ${q.scene?SCENES[q.scene]():""}
   <h2 id="qh">${esc(tr(q.q))}</h2>${q.help?`<p class="help">${esc(tr(q.help))}</p>`:`<div style="height:12px"></div>`}
   ${q.examples?`<div class="examples" aria-label="${esc(t("examples"))}">${q.examples.map(e=>`<span>${esc(e)}</span>`).join("")}</div>`:""}
   <div class="opts ${q.grid?"two":""}" role="group" aria-labelledby="qh">
   ${q.opts.map(([v,l])=>{const on=q.type==="multi"?sel.includes(v):sel===v;
     return `<button class="opt" data-kind="${q.type}" data-v="${v}" aria-pressed="${on}"><span class="tick" aria-hidden="true"></span><span>${esc(tr(l))}</span></button>`}).join("")}
   </div>
   <div class="nav"><button class="btn" id="back">${esc(t("back"))}</button>
   <button class="btn primary" id="next" ${isAnswered(q)?"":"disabled"}>${esc(step===N-1?t("seePlan"):t("cont"))}</button></div>
   <p class="hint" id="hint" aria-live="polite">${isAnswered(q)?"":esc(q.type==="multi"?t("pickMulti"):t("pickOne"))}</p>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(q,b.dataset.v));
  document.getElementById("back").onclick=()=>{step--;render();};
  document.getElementById("next").onclick=()=>{step++;render();window.scrollTo(0,0);};
  const h=document.getElementById("qh"); h.tabIndex=-1; if(step>0||document.activeElement!==document.body)h.focus({preventScroll:true});
}
function pick(q,v){
  if(q.type==="single"){answers[q.id]=v;}
  else{let cur=[...(answers[q.id]||[])];
    if(v===q.exclusive)cur=cur.includes(v)?[]:[v];
    else{cur=cur.filter(x=>x!==q.exclusive);
      if(cur.includes(v))cur=cur.filter(x=>x!==v);
      else{if(q.max&&cur.length>=q.max){document.getElementById("hint").textContent=t("max",{n:q.max});return;}cur.push(v);}}
    answers[q.id]=cur;}
  const scroll=window.scrollY; render(); window.scrollTo(0,scroll);
  const b=app.querySelector(`.opt[data-v="${v}"]`); if(b)b.focus({preventScroll:true});
}

function card(item,kind){const c=COURSES[item.id];
  const meta=`<div class="meta"><span>${esc(tr(c.cat))}</span><span>${esc(t("hours",{h:c.h}))}</span>${item.after?`<span class="after">${esc(t("after",{x:COURSES[item.after].name}))}</span>`:""}</div>`;
  if(kind==="start")return `<article class="start"><div class="lbl">${esc(t("startHere"))}</div><h3 lang="en">${esc(c.name)}</h3>${meta}
    <div class="why">${esc(item.why)}</div><button class="cta" data-c="${item.id}" data-act="start">${esc(t("startCourse"))}</button><div class="toast" aria-live="polite"></div></article>`;
  return `<article class="course">${meta}<h3 lang="en">${esc(c.name)}</h3><p>${esc(item.why)}</p>
    <button class="cta" data-c="${item.id}" data-act="${kind}">${esc(kind==="later"?t("saveLater"):t("addPlan"))}</button><div class="toast" aria-live="polite"></div></article>`;}

function summary(r){
  const a=answers, s=new Set(r.skills);
  const goals=(a.goals||[]).map(g=>tr(LABELS.goals[g])).join(t("listSep"));
  const phone=s.has("web_search")&&s.has("online_forms")?t("phOnline"):s.has("web_search")?t("phSearch"):s.has("phone_typing")?t("phWA"):t("phStart");
  const comp=s.has("spreadsheet")?t("pcSheet"):s.has("computer_basics")?t("pcUsed"):t("pcNot");
  const ai={never:t("aiNever"),once:t("aiOnce"),month:t("aiMonth"),week:t("aiWeek")}[a.aiUse];
  const eng=s.has("eng_basic")&&s.has("eng_reading")?t("enBoth"):s.has("eng_reading")?t("enRead"):s.has("eng_basic")?t("enSpeak"):t("enStart");
  return [[t("kTrade"),tr(LABELS.trade[a.trade])],[t("kGoals"),goals],[t("kStudies"),tr(LABELS.education[a.education])],
    [t("kPhone"),phone],[t("kComp"),comp],[t("kAI"),ai],[t("kEng"),eng]];
}
function results(){
  setBar(N,t("ready")); const r=recommend(answers);
  app.innerHTML=`<section class="screen"><div class="plan-head"><h1>${esc(t("rH1"))}</h1>
   <p class="help">${esc(t("rHelp"))}</p></div>
   ${card(r.start,"start")}
   ${r.next.length?`<h2 class="sec">${esc(t("next"))}</h2>${r.next.map(n=>card(n,"next")).join("")}`:""}
   ${r.later.length?`<h2 class="sec">${esc(t("alsoLike"))}</h2>${r.later.map(n=>card(n,"later")).join("")}`:""}
   <h2 class="sec">${esc(t("understood"))}</h2>
   <div class="understood">${summary(r).map(([k,v])=>`<div><span>${esc(k)}</span><span>${esc(v||"")}</span></div>`).join("")}</div>
   <div class="nav"><button class="btn" id="change">${esc(t("change"))}</button><button class="btn primary" id="again">${esc(t("again"))}</button></div>
   <details class="staff" lang="en"><summary>For staff: how this plan was made</summary>
     <p><b>AI level ${r.level} of 5</b></p><div class="level">${[1,2,3,4,5].map(i=>`<i class="${i<=r.level?"on":""}"></i>`).join("")}</div>
     <p><b>Skills shown by the answers:</b><br>${r.skills.length?r.skills.map(x=>`<code>${x}</code>`).join(", "):"None yet"}</p>
     <p><b>Safety flags:</b> ${r.risks.scam?"would pay or call on a fake job message. ":""}${r.risks.unchecked?"uses AI often without checking. ":""}${!r.risks.scam&&!r.risks.unchecked?"none":""}</p>
     <p><b>Answers:</b> <code>${esc(JSON.stringify(answers))}</code></p></details>
  </section>`;
  app.querySelectorAll(".cta").forEach(b=>b.onclick=()=>{const toast=b.nextElementSibling, act=b.dataset.act;
    if(act==="start"){
      toast.textContent=t("tOpening");window.open(LIVE_URL,"_blank","noopener");
    }else toast.textContent=act==="later"?t("tSaved"):t("tAdded");});
  document.getElementById("change").onclick=()=>{step=0;render();};
  document.getElementById("again").onclick=()=>{Object.keys(answers).forEach(k=>delete answers[k]);step=-1;render();};
  window.scrollTo(0,0);
}
setLang(LANG);
render();
</script>
</body>
</html>
