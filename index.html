<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swift AI Academy - Find your courses (ITI)</title>
<style>
:root{
  color-scheme: light;
  --navy:#0E1B5C; --navy-2:#1A2B85; --navy-deep:#0A1240;
  --blue:#3D5AFE; --blue-dk:#2A3FCC; --blue-tint:#EAEEFF; --blue-lt:#6F87FF;
  --gold:#FBB034; --gold-tint:#FFF4DC; --gold-dk:#E08F0E;
  --bg:#F6F8FF; --surface:#FFFFFF; --surface-2:#F6F7FB; --line:#E2E6F2;
  --text:#0E1B5C; --text-2:#5A638C; --text-3:#8A93B8;
  --ok:#16A34A; --danger:#DC2626; --danger-tint:#FDECEC;
  --r-card:16px; --r-lg:24px; --r-pill:999px;
  --shadow:0 1px 2px rgba(14,27,92,.05),0 4px 12px -4px rgba(14,27,92,.08),0 16px 32px -16px rgba(14,27,92,.14);
  --font:"Cabinet Grotesk","Noto Sans","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.55;font-weight:500;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.2;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.eyebrow.on-dark{color:var(--gold)}
.hint{color:var(--text-2);font-size:15.5px}
.mini{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin:14px 0 6px}
.muted{color:var(--text-2);font-size:14px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.topbar img{width:40px;height:auto}
.topbar .brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.topbar .brand span{color:var(--blue)}
.topbar .tag{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);text-align:right}
#app{max-width:1120px;margin:0 auto;padding:0 16px 40px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:var(--r-pill);border:2px solid transparent;font-weight:700;font-size:17px;line-height:1.2;text-align:center;transition:background .15s,border-color .15s}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dk)}
.btn.secondary{background:var(--blue-tint);color:var(--blue-dk);border-color:var(--blue-tint)}
.btn.secondary:hover{border-color:var(--blue)}
.btn.ghost{background:var(--surface);color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.link{background:none;border:none;color:var(--blue-dk);text-decoration:underline;text-underline-offset:3px;padding:8px 6px;min-height:44px}
.btn.big{min-height:58px;font-size:18px;width:100%}
.btn.full{width:100%;margin-top:16px}
.icon-btn{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round}

/* ---------- welcome ---------- */
.welcome{display:grid;gap:20px;padding-top:20px}
.welcome-hero{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:28px 24px 30px;position:relative;overflow:hidden}
.welcome-hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:40px solid rgba(255,255,255,.05)}
.welcome-hero .brand-mark{width:64px;height:auto;margin-bottom:18px;background:#fff;border-radius:14px;padding:6px}
.welcome-hero h1{font-size:clamp(32px,7vw,52px);letter-spacing:-.04em;margin:10px 0 14px;color:#fff}
.welcome-hero .lead{color:rgba(255,255,255,.86);max-width:52ch;font-size:18px}
.facts{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;position:relative;z-index:1}
.facts li{display:flex;gap:12px;align-items:flex-start;color:#fff}
.facts svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--gold);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.welcome-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.field-label{font-weight:800;font-size:20px}
.text-input{width:100%;min-height:54px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:18px}
.text-input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px var(--blue-tint)}
.welcome-form .btn.big{margin-top:8px}
.demo-box{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.demo-box summary{cursor:pointer;font-weight:700;color:var(--text-2);min-height:44px;display:flex;align-items:center}
.persona-list{display:grid;gap:8px;margin-top:10px}
.persona{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.persona:hover{border-color:var(--blue)}
.persona span{color:var(--text-2);font-size:15px}
@media(min-width:860px){.welcome{grid-template-columns:1.25fr 1fr;padding-top:32px}.welcome-hero{padding:44px 40px}}

/* ---------- quiz ---------- */
.quiz{max-width:680px;margin:0 auto;padding-top:16px}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 16px 14px;margin-bottom:18px}
.progress-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:15px;color:var(--text-2)}
.progress-row strong{color:var(--navy)}
.progress-pct{font-family:var(--mono);font-size:13px}
.segments{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}
.seg{height:8px;border-radius:var(--r-pill);background:var(--line)}
.seg.done{background:var(--blue)}
.seg.now{background:linear-gradient(90deg,var(--blue) 50%,var(--blue-tint) 50%)}
.screen-title{font-size:clamp(26px,5.5vw,34px);letter-spacing:-.03em;margin:4px 2px 14px}
.qs{display:grid;gap:18px}
.q{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);padding:18px 16px;margin:0;min-width:0}
.q.has-err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-tint)}
.q-title{font-weight:800;font-size:19px;line-height:1.35;margin:0 0 4px}
.q .hint{margin-bottom:10px}
.err{color:var(--danger);font-weight:700;margin-top:10px;font-size:15.5px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 14px;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:17px;font-weight:600;line-height:1.35;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--blue-lt)}
.opt.sel{border-color:var(--blue);background:var(--blue-tint)}
.opt-text{flex:1;min-width:0;overflow-wrap:anywhere}
.mark{flex:none;width:26px;height:26px;border:2px solid var(--text-3);display:grid;place-items:center;background:var(--surface)}
.mark.radio{border-radius:50%}
.mark.checkbox{border-radius:7px}
.opt.sel .mark{background:var(--blue);border-color:var(--blue)}
.mark svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt.chip{width:auto;min-height:48px;padding:8px 14px 8px 10px;gap:8px;border-radius:var(--r-pill);font-size:16px}
.opt.chip .mark{width:22px;height:22px}
.opt.chip .mark svg{width:13px;height:13px}
.select-wrap{position:relative;margin-top:10px}
.select-wrap::after{content:"";position:absolute;right:18px;top:50%;width:10px;height:10px;border-right:2.5px solid var(--navy);border-bottom:2.5px solid var(--navy);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select-wrap select{appearance:none;-webkit-appearance:none;width:100%;min-height:58px;padding:12px 48px 12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:17px;font-weight:600;text-overflow:ellipsis}
.select-wrap select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px var(--blue-tint)}
.q .text-input{margin-top:10px}
.scene{margin:0 0 14px;padding:14px 16px;border-radius:14px;background:var(--blue-tint);border:1px solid #D4DCFF}
.scene-who{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-dk)}
.scene-text{font-size:19px;font-weight:700;margin-top:4px;line-height:1.4}
.scene.notice{background:var(--gold-tint);border:2px dashed var(--gold-dk)}
.scene.notice .scene-who{color:#8A5300}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.examples .hint{margin:0 4px 0 0}
.ex{font-size:14.5px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line)}
.actionbar{position:sticky;bottom:0;z-index:10;display:flex;gap:10px;justify-content:space-between;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:18px;background:linear-gradient(to top,var(--bg) 75%,rgba(246,248,255,0))}
.actionbar .btn{flex:1;max-width:260px}
.actionbar .btn.primary{flex:1.6;max-width:none}

/* ---------- processing ---------- */
.processing{max-width:520px;margin:48px auto;background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:36px 28px;text-align:left}
.processing .brand-mark{width:60px;height:auto;background:#fff;border-radius:12px;padding:6px;margin-bottom:18px}
.processing h2{font-size:28px;color:#fff}
.proc-steps{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:14px}
.proc-steps li{display:flex;gap:12px;align-items:center;color:rgba(255,255,255,.6);font-size:18px;transition:color .3s}
.ps-dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex:none;transition:all .3s}
.proc-steps li.done{color:#fff}
.proc-steps li.done .ps-dot{background:var(--gold);border-color:var(--gold)}

/* ---------- results ---------- */
.results{padding-top:16px}
.res-head{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:26px 24px}
.res-head h1{font-size:clamp(28px,6vw,44px);letter-spacing:-.035em;color:#fff;margin:8px 0 10px}
.res-head .lead{color:rgba(255,255,255,.85);max-width:62ch}
.res-grid{display:grid;gap:24px;margin-top:22px}
.res-main,.res-side{min-width:0}
@media(min-width:1000px){.res-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.res-side{position:sticky;top:76px}}
.slot-h{display:flex;align-items:center;gap:12px;font-size:26px;letter-spacing:-.03em;margin:26px 0 14px}
.slot-h:first-child{margin-top:0}
.slot-h.plain{margin-bottom:4px}
.slot-num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.res-main > .hint{margin-bottom:14px}
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.course .thumb{aspect-ratio:16/9;background:var(--cat);flex:none}
.course .thumb svg{width:100%;height:100%}
.course-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;font-weight:700;padding:4px 11px;border-radius:14px;line-height:1.35;overflow-wrap:anywhere}
.pill.cat{background:var(--cat-tint);color:var(--cat)}
.pill.planned{background:var(--gold-tint);color:#7A4A00}
.pill.later{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.course h3{font-size:22px;letter-spacing:-.02em;overflow-wrap:anywhere}
.course .one{color:var(--text-2)}
.meta{display:grid;gap:8px;margin:0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.meta dt{display:flex;gap:6px;align-items:center;color:var(--text-2);font-size:15px}
.meta dt svg,.summary dt svg{width:18px;height:18px;fill:none;stroke:var(--text-2);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.meta dd{margin:0;font-weight:600;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.lang-note{display:block;font-weight:500;color:#8A5300;font-size:14px;margin-top:2px}
.skills .mini{margin-top:0}
.tags{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:14px;font-weight:700;padding:5px 11px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);overflow-wrap:anywhere}
.tags.small li{font-size:13px;padding:3px 9px}
.why{background:var(--cat-tint);border-radius:12px;padding:14px 16px}
.why-h{font-weight:800;font-size:16px;margin-bottom:4px;color:var(--navy)}
.why p:last-child{font-size:16px;line-height:1.55}
.modules summary{cursor:pointer;font-weight:700;color:var(--blue-dk);min-height:44px;display:flex;align-items:center}
.modules ol{margin:4px 0 0;padding-left:22px;color:var(--text-2);font-size:15.5px;display:grid;gap:4px}
.course-actions{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:10px}
.course-actions .btn{flex:1 1 auto}
@media(min-width:760px){
  .course.featured{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
  .course.featured .thumb{aspect-ratio:auto;min-height:100%}
  .course.featured .course-body{padding:24px 26px}
  .course.featured h3{font-size:27px}
}
.course.featured{border:2px solid var(--blue)}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;margin-bottom:18px;min-width:0}
.side-h{font-size:20px;margin-bottom:4px}
.path{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0}
.path-step{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:16px}
.path-step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.path-num{width:34px;height:34px;border-radius:50%;background:var(--cat);color:#fff;display:grid;place-items:center;font-weight:800}
.path-stage{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.path-name{font-weight:700;overflow-wrap:anywhere}
.summary{margin:12px 0 0;display:grid;gap:10px}
.sum-row{display:grid;gap:2px}
.summary dt{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--text-2)}
.summary dd{margin:0 0 0 24px;font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.res-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:10px;padding-top:18px;border-top:1px solid var(--line)}
.empty{padding:20px;background:var(--surface);border-radius:var(--r-card)}

/* ---------- staff ---------- */
.staff{margin-top:20px;background:var(--surface-2);border:1px dashed var(--text-3);border-radius:var(--r-card);padding:20px 16px}
.staff h2{font-size:24px}
.staff h3{font-size:18px;margin-bottom:6px}
.staff-grid{display:grid;gap:16px;margin-top:14px}
@media(min-width:860px){.staff-grid{grid-template-columns:1fr 1fr}}
.kvs{display:flex;flex-wrap:wrap;gap:8px}
.kv{background:var(--blue-tint);border-radius:10px;padding:6px 10px;font-size:15px}
.table-wrap{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.staff-table{border-collapse:collapse;width:100%;min-width:820px;font-size:14px}
.staff-table th,.staff-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.staff-table th{background:var(--surface-2);font-weight:800}
.staff-table td.num{font-family:var(--mono)}
.staff-table tr.hl td{background:#F3F5FF}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,18,64,.55);display:grid;place-items:center;padding:20px}
.modal-card{position:relative;background:var(--surface);border-radius:var(--r-lg);padding:28px 22px 22px;max-width:440px;width:100%;display:grid;gap:12px}
.modal-card h2{font-size:24px;padding-right:44px}
.modal-card .btn{justify-self:start;min-width:120px}

@media(max-width:520px){.topbar .tag{display:none}}
@media(max-width:420px){
  body{font-size:16.5px}
  #app{padding:0 12px 32px}
  .q{padding:16px 13px}
  .meta div{grid-template-columns:1fr;gap:2px}
  .actionbar .btn{padding:12px 14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ============ ENGINE: generic, metadata-driven. No course IDs appear in this file. ============ */

/* ---- 1. Evidence rules: answers -> skills held. One rule per skill; questions never reference courses. ---- */
const has = (arr, v) => Array.isArray(arr) && arr.includes(v);
const nonFun = a => (a.aiPurpose||[]).filter(x=>x!=='fun');
const EVIDENCE = {
  phone_typing:   a => a.phone && a.phone!=='none' && has(a.phoneDone,'msg'),
  file_sharing:   a => has(a.phoneDone,'pdf'),
  web_search:     a => has(a.phoneDone,'search'),
  online_forms:   a => has(a.phoneDone,'form') || has(a.commDone,'jobform'),
  email_use:      a => has(a.phoneDone,'email') || has(a.computerDone,'email') || has(a.commDone,'email'),
  computer_basics:a => a.computerUse==='often' || (a.computerUse==='few' && (a.computerDone||[]).some(x=>x!=='none')),
  doc_typing:     a => has(a.computerDone,'doc'),
  spreadsheet:    a => has(a.computerDone,'sheet'),
  slides:         a => has(a.computerDone,'slides'),
  coding_basics:  a => has(a.computerDone,'code'),
  design_tools:   a => has(a.computerDone,'design') || has(a.computerDone,'cad'),
  ai_aware:       a => a.aiUsed==='yes' || has(a.interests,'ai'),
  ai_first_use:   a => a.aiUsed==='yes',
  ai_prompting:   a => a.aiUsed==='yes' && ['month','week'].includes(a.aiFreq) && nonFun(a).length>=2,
  ai_verification:a => a.aiUsed==='yes' && a.aiCheck==='check',
  ai_task_use:    a => a.aiUsed==='yes' && (a.aiFreq==='week' || (a.aiFreq==='month' && has(a.aiPurpose,'trade'))) && nonFun(a).length>=2,
  ai_safety:      a => a.aiUsed==='yes' && a.aiFreq==='week' && a.aiCheck==='check' && a.scam==='check',
  ai_method:      a => a.aiUsed==='yes' && a.aiFreq==='week' && nonFun(a).length>=3 && a.aiCheck==='check',
  eng_basic:      a => ['many','few'].includes(a.introEnglish) || has(a.speak,'English'),
  eng_instructions:a=> ['reply_en','reply_own'].includes(a.scenarioInstr),
  eng_reading:    a => a.readNotice==='tuesday',
  eng_forms_writing:a=> has(a.commDone,'letter') || has(a.commDone,'jobform') || has(a.commDone,'email'),
  trade_talk:     a => a.scenarioInstr==='reply_en' && (has(a.commDone,'explain') || a.workExp==='job' || a.itiStatus==='apprentice'),
  customer_talk:  a => a.customerReply==='b' && (has(a.commDone,'customers') || a.workExp!=='none'),
  job_cards_logs: a => has(a.commDone,'diary'),
  email_writing:  a => has(a.commDone,'email'),
  interview_skills:a=> a.interviews==='many',
  gd_skills:      a => has(a.commDone,'gd'),
  spoken_clarity: a => has(a.commDone,'talk'),
  cv_writing:     a => has(a.commDone,'cv') || has(a.aiPurpose,'cv'),
  team_instructions:a=> has(a.commDone,'lead') && a.scenarioInstr==='reply_en',
  reporting_upward:a=> has(a.commDone,'lead') && a.scenarioInstr==='reply_en' && a.workExp==='job'
};

/* ---- 2. Scoring weights: one config object, tuned once, applied to every course ---- */
const WEIGHTS = { goal:0.30, level:0.20, unlock:0.12, interest:0.12, urgency:0.10, trade:0.06, lang:0.05, time:0.05 };
const BONUS = { risk:0.12, access:0.10, gateway:0.08, seriesOrder:0.10 };
const LADDER_PASS = 0.6;         // share of a rung's skills a learner must hold to be placed above it
const DEFAULT_MIN_RELEVANCE = 0.25;
const WEEKLY_HOURS = {low:1.5, mid:4, high:6};

function makeEngine(D){
  const {SKILLS,GOALS,TRADES,EDU_RANK} = D;
  let COURSES = D.COURSES.slice();

  /* ---- Knowledge graph: derived from metadata on every load ---- */
  function buildGraph(){
    const teachersOf = {};                 // skill -> courses that teach it
    COURSES.forEach(c=>c.teaches.forEach(s=>(teachersOf[s]=teachersOf[s]||[]).push(c.id)));
    const edges = [];                      // {from, to, via:skill, type}
    COURSES.forEach(b=>{
      const req = [...b.prereq.all, ...b.prereq.any];
      req.forEach(s=>(teachersOf[s]||[]).forEach(aid=>{ if(aid!==b.id) edges.push({from:aid,to:b.id,via:s,type:'LEADS_TO'}); }));
    });
    // ladder tracks: rung -> courses
    const tracks = {};
    COURSES.filter(c=>c.ladder).forEach(c=>{ const t=(tracks[c.ladder.track]=tracks[c.ladder.track]||{}); (t[c.ladder.rung]=t[c.ladder.rung]||[]).push(c); });
    // goal links through skills
    const goalLinks = [];
    COURSES.forEach(c=>Object.entries(GOALS).forEach(([g,G])=>{ const hit=c.teaches.filter(s=>G.needs.includes(s)); if(hit.length) goalLinks.push({course:c.id, goal:g, via:hit}); }));
    const orphanSkills = Object.keys(SKILLS).filter(s=>!teachersOf[s]);
    return {teachersOf, edges, tracks, goalLinks, orphanSkills};
  }
  let G = buildGraph();

  /* ---- Learner profile ---- */
  function buildProfile(a){
    const skills = new Set(Object.entries(EVIDENCE).filter(([s,f])=>{ try{return !!f(a);}catch(e){return false;} }).map(([s])=>s));
    const trade = TRADES.find(t=>t.id===a.trade) || {id:'other',label:a.tradeOther||'Other',group:'other'};
    const tradeLabel = a.trade==='other' ? (a.tradeOther||'your trade') : trade.label;
    const goalIds = (a.goals||[]).slice();
    if(has(a.interests,'lead')) goalIds.push('lead_team');
    const goalList = goalIds.map((g,i)=>({id:g, w: GOALS[g].implicit ? 0.6 : [1,0.85,0.7][i]||0.6}));
    const interests = new Set((a.interests||[]).filter(x=>x!=='none'));
    if(a.workType==='computers') interests.add('computers');
    if(a.workType==='people') interests.add('customers');
    if(a.workType==='machines') interests.add('repair');
    if(has(a.goals,'tech_career')) interests.add('computers');
    const readLangs = (a.read||[]);
    const prefLangs = a.learnLang==='Both' ? ['English','Hindi'] : a.learnLang==='Regional' ? readLangs.filter(l=>!['English','Hindi'].includes(l)) : [a.learnLang];
    const p = {a, skills, trade:trade.id, tradeGroup:trade.group, tradeLabel, goalList, interests, readLangs, prefLangs,
               weekly: WEEKLY_HOURS[a.weeklyTime]||3};
    p.levels = {};
    Object.keys(G.tracks).forEach(t=>p.levels[t]=trackLevel(t, skills));
    p.labels = describe(p);
    p.commNeeds = commNeeds(p);
    return p;
  }

  // Level on a track = first rung whose taught skills the learner does not mostly hold
  function trackLevel(track, skills){
    const rungs = Object.keys(G.tracks[track]).map(Number).sort((x,y)=>x-y);
    for(const r of rungs){
      const taught = [...new Set(G.tracks[track][r].flatMap(c=>c.teaches))];
      const held = taught.filter(s=>skills.has(s)).length / taught.length;
      if(held < LADDER_PASS) return r;
    }
    return rungs[rungs.length-1];
  }

  function describe(p){
    const s=p.skills, a=p.a;
    const digitalCount = ['phone_typing','file_sharing','web_search','online_forms','email_use'].filter(x=>s.has(x)).length;
    const phone = a.phone==='none' ? 'No smartphone yet' : digitalCount<=1 ? 'Starting out on a phone' : digitalCount<=3 ? 'Comfortable with WhatsApp and basics' : 'Confident on a phone';
    const comp = !s.has('computer_basics') ? 'New to computers' : ['doc_typing','spreadsheet','slides','coding_basics'].filter(x=>s.has(x)).length>=2 ? 'Confident on a computer' : 'Some computer use';
    const ai = !s.has('ai_first_use') ? 'New to AI apps' : s.has('ai_task_use') ? 'Uses AI apps for real tasks' : 'Has tried AI apps';
    const cl = p.levels.comm||1;
    const eng = cl<=1 ? 'Building English basics' : cl===2 ? 'Basic English at work' : 'Confident English at work';
    return {phone, comp, ai, eng};
  }

  function s_has(p,s){ return p.skills.has(s); }
  function commNeeds(p){
    const s=p.skills, n=[], cl=p.levels.comm||1, jobish=p.goalList.some(g=>['private_job','govt_job','apprenticeship','trade_work','improve_english'].includes(g.id));
    const goalNeeds = new Set(p.goalList.flatMap(g=>GOALS[g.id].needs));
    const englishMatters = ['eng_basic','eng_instructions','eng_reading','trade_talk'].some(s=>goalNeeds.has(s) && !s_has(p,s)) || (p.a.relocate==='yes' && !s_has(p,'eng_basic'));
    if(cl<=1 && englishMatters) n.push('Foundation communication');
    if(cl===2 && englishMatters) n.push('Workplace communication');
    if(jobish && !s.has('interview_skills')) n.push('Interview preparation');
    if(!s.has('email_writing') && p.goalList.some(g=>GOALS[g.id].needs.includes('email_writing'))) n.push('Professional writing');
    if(!s.has('spoken_clarity') && (p.interests.has('lead')||p.interests.has('customers')||p.goalList.some(g=>['study_further','improve_english'].includes(g.id)))) n.push('Presentation and speaking');
    if(cl>=3) n.push('Advanced communication development');
    return n;
  }

  /* ---- 3. Eligibility: hard rules. A score can never override these. ---- */
  function eligibility(c, have, p){
    const blocks = [];
    const missAll = c.prereq.all.filter(s=>!have.has(s));
    if(missAll.length) blocks.push({type:'skill', skills:missAll});
    if(c.prereq.any.length && !c.prereq.any.some(s=>have.has(s))) blocks.push({type:'skillAny', skills:c.prereq.any});
    if(c.prereq.minEducation){
      const ok = (EDU_RANK[p.a.education]||0) >= EDU_RANK[c.prereq.minEducation] || (c.prereq.altEducationTrades||[]).includes(p.tradeGroup);
      if(!ok) blocks.push({type:'education', need:c.prereq.minEducation});
    }
    if(c.prereq.experience==='job' && p.a.workExp!=='job') blocks.push({type:'experience'});
    if(c.device==='computer' && p.a.computerAccess==='no') blocks.push({type:'device'});
    if(c.langStrict && !c.langs.some(l=>p.readLangs.includes(l))) blocks.push({type:'language', langs:c.langs});
    const gap = c.teaches.filter(s=>!have.has(s));
    if(!gap.length) blocks.push({type:'mastered'});
    // can blocks be cleared by learning other catalogue courses?
    const hard = blocks.some(b=>['education','experience','device','language','mastered'].includes(b.type));
    const teachable = blocks.every(b=>b.type==='skill' ? b.skills.every(s=>G.teachersOf[s]) : b.type==='skillAny' ? b.skills.some(s=>G.teachersOf[s]) : false);
    const status = !blocks.length ? 'eligible' : (!hard && teachable ? 'later' : 'excluded');
    return {status, blocks, gap};
  }

  /* ---- 4. Relevance: weighted features, every one computed from metadata ---- */
  function relevance(c, have, p){
    const gap = c.teaches.filter(s=>!have.has(s));
    const f = {}; const why = [];
    // goal fit: gap skills that the learner's goals need
    let best=0, extra=0, goalHits=[];
    p.goalList.forEach(g=>{ const hit=gap.filter(s=>GOALS[g.id].needs.includes(s)); if(hit.length){ const v=g.w*Math.min(1,hit.length/2); goalHits.push({goal:g.id,skills:hit,v}); if(v>best){extra+=best?0.15:0; best=v;} else extra+=0.15; } });
    f.goal = Math.min(1, best+extra);
    goalHits.sort((x,y)=>y.v-x.v);
    // level fit
    if(c.ladder){ const lvl=p.levels[c.ladder.track]; const d=c.ladder.rung-lvl; f.level = d===0?1 : d===1?0.45 : d===-1?0.3 : 0; }
    else f.level = 0.5;
    // unlock value: how many other relevant courses this opens
    const have2 = new Set([...have, ...c.teaches]);
    const opens = COURSES.filter(o=>o.id!==c.id && eligibility(o,have,p).status!=='eligible' && eligibility(o,have2,p).status==='eligible' && o.teaches.some(s=>p.goalList.some(g=>GOALS[g.id].needs.includes(s))));
    f.unlock = Math.min(1, opens.length/3);
    // interest
    const ih = (c.interests||[]).filter(i=>p.interests.has(i));
    f.interest = ih.length>=2 ? 1 : ih.length===1 ? 0.7 : 0;
    // urgency
    const jt=p.a.jobTiming;
    f.urgency = has(c.tags,'jobReady') ? (jt==='now'?1:jt==='six'?0.75:0.3) : 0;
    if(has(c.tags,'short') && has(c.tags,'jobReady') && jt==='now') f.urgency = Math.min(1,f.urgency+0.2);
    // trade
    f.trade = (c.trades.includes(p.trade)||c.trades.includes(p.tradeGroup)) ? 1 : c.trades.includes('all') ? 0.5 : 0.1;
    if(c.tradeContext) f.trade = Math.min(1,f.trade+0.3);
    // language
    f.lang = c.langs.some(l=>p.prefLangs.includes(l)) ? 1 : c.langs.some(l=>p.readLangs.includes(l)) ? 0.6 : 0.2;
    // time
    const weeks = Math.ceil(c.hours / p.weekly);
    f.time = weeks<=8 ? 1 : weeks<=16 ? 0.7 : 0.4;
    let score = Object.entries(WEIGHTS).reduce((t,[k,w])=>t+w*(f[k]||0),0);
    // safety priority: the learner's own answers show exposure to harm that this course closes
    const riskHits = gap.filter(s=>SKILLS[s].risk && SKILLS[s].risk(p.a));
    if(riskHits.length) score += BONUS.risk;
    // access first: a course tagged 'access' leads when the learner is on its rung (platform use depends on it)
    const access = has(c.tags,'access') && c.ladder && p.levels[c.ladder.track]<=c.ladder.rung;
    if(access) score += BONUS.access;
    // gateway rule: a foundation course on a track where the learner sits on its rung is preferred as a first step
    const gateway = c.stage==='foundation' && c.ladder && p.levels[c.ladder.track]===c.ladder.rung && c.ladder.rung<=2;
    if(gateway) score += BONUS.gateway;
    // series order: if an earlier unit of the same series is still open for this learner, this one waits
    const earlierOpen = c.series && COURSES.some(o=>o.series && o.series.id===c.series.id && o.series.order<c.series.order && o.teaches.some(s=>!have.has(s)));
    if(earlierOpen) score -= BONUS.seriesOrder;
    const purpose = f.goal>0 || riskHits.length>0;
    return {score:Math.round(score*1000)/1000, f, gap, goalHits, riskHits, interestHits:ih, opens:opens.map(o=>o.id), weeks, gateway, access, purpose};
  }

  /* ---- 5. Path planner ---- */
  function recommend(answers){
    const p = buildProfile(answers);
    const have = p.skills;
    const rows = COURSES.map(c=>{ const e=eligibility(c,have,p); const r=relevance(c,have,p); return {c, e, r}; });
    const minRel = c => c.minRelevance ?? DEFAULT_MIN_RELEVANCE;
    const byScore = (x,y)=>y.r.score-x.r.score;
    const eligibleNow = rows.filter(x=>x.e.status==='eligible' && x.r.score>=minRel(x.c)).sort(byScore);
    // Start and Next must serve something the learner asked for (a goal) or a safety risk
    const purposeful = eligibleNow.filter(x=>x.r.purpose);
    // fallback: if nothing clears the relevance bar, offer the best eligible course rather than an empty plan
    const anyEligible = rows.filter(x=>x.e.status==='eligible').sort(byScore);
    const start = purposeful[0] || eligibleNow[0] || anyEligible[0] || null;
    const next = [];
    if(start){
      const have2 = new Set([...have, ...start.c.teaches]);
      const isSuccessor = c => G.edges.some(e=>e.from===start.c.id && e.to===c.id) ||
        (c.ladder && start.c.ladder && c.ladder.track===start.c.ladder.track && c.ladder.rung===start.c.ladder.rung+1) ||
        (c.series && start.c.series && c.series.id===start.c.series.id && c.series.order===start.c.series.order+1);
      const follow = COURSES.filter(c=>c.id!==start.c.id && isSuccessor(c))
        .map(c=>({c, e:eligibility(c,have2,p), r:relevance(c,have2,p)}))
        .filter(x=>x.e.status==='eligible' && x.r.score>=minRel(x.c) && x.r.purpose).sort(byScore);
      if(follow[0]) next.push({...follow[0], e:eligibility(follow[0].c,have,p), kind:'follow', after:start.c.id});
      const taken = id => id===start.c.id || next.some(n=>n.c.id===id);
      const rest = purposeful.filter(x=>!taken(x.c.id));
      if(rest.length && next.length<2){
        const top = rest[0];
        const domains = new Set([start.c.domain, ...next.map(n=>n.c.domain)]);
        const diverse = rest.find(x=>!domains.has(x.c.domain));
        const pick = (diverse && diverse.r.score >= top.r.score-0.12) ? diverse : top;
        next.push({...pick, kind:'parallel'});
      }
      const rest2 = purposeful.filter(x=>!taken(x.c.id));
      if(next.length<2 && rest2[0]) next.push({...rest2[0], kind:'parallel'});
    }
    const used = new Set([start&&start.c.id, ...next.map(n=>n.c.id)].filter(Boolean));
    // 'later' courses qualify only when what they still need is taught by the Start or Next courses
    const pathTeaches = new Set([...used].flatMap(id=>COURSES.find(c=>c.id===id).teaches));
    const oneStepAway = x => x.e.blocks.every(b=>b.type==='skill' ? b.skills.every(s=>pathTeaches.has(s)||have.has(s)) : b.type==='skillAny' ? b.skills.some(s=>pathTeaches.has(s)) : false);
    const later = rows.filter(x=>x.e.status==='later' && oneStepAway(x) && x.r.score>=minRel(x.c));
    const alsoScore = x => x.r.score + 0.1*(x.r.interestHits.length>0) + 0.1*(x.r.riskHits.length>0);
    const also = [...eligibleNow, ...later].filter(x=>!used.has(x.c.id) && (x.r.purpose || x.r.interestHits.length))
      .sort((x,y)=>alsoScore(y)-alsoScore(x)).slice(0,3);
    const recs = [];
    if(start) recs.push({slot:'start', ...start});
    next.slice(0,2).forEach(n=>recs.push({slot:'next', ...n}));
    also.forEach(x=>recs.push({slot:'also', ...x}));
    recs.forEach(x=>x.why = explain(x, p, recs));
    const path = buildPath(recs);
    // needs the catalogue cannot serve for this learner right now: product backlog signal
    const served = new Set(recs.flatMap(x=>x.c.teaches));
    const unserved = [...new Set(p.goalList.flatMap(g=>GOALS[g.id].needs))].filter(s=>!have.has(s) && !served.has(s));
    return {profile:p, recs, rows, path, graph:G, unserved};
  }

  function buildPath(recs){
    const order = {foundation:0, skill:1, applied:2};
    const chosen = recs.filter(r=>r.slot!=='also').map(r=>r.c);
    return ['foundation','skill','applied'].map(st=>({stage:st, courses:chosen.filter(c=>c.stage===st)}));
  }

  /* ---- 6. Explanations: built from the learner's own answers ---- */
  function gapText(s,p){ const g=SKILLS[s].gap; return typeof g==='function' ? g(p) : g; }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function explain(x, p, recs){
    const {c, r} = x; const parts = [];
    const gh = r.goalHits[0];
    if(r.riskHits.length){
      parts.push(`${cap(gapText(r.riskHits[0],p))}.`);
      if(gh && !gh.skills.includes(r.riskHits[0])) parts.push(`This matters for your plan to ${GOALS[gh.goal].phrase}.`);
    } else if(gh){
      const G0 = GOALS[gh.goal];
      const lead = G0.implicit ? `You said you would like to ${G0.phrase}` : `You told us you want to ${G0.phrase}`;
      parts.push(`${lead}, and ${gapText(gh.skills[0],p)}.`);
    } else if(r.gap.length){
      parts.push(`${cap(gapText(r.gap[0],p))}.`);
    }
    const used = r.riskHits[0] || (gh && gh.skills[0]);
    const core = r.gap.find(s=>s!==used && SKILLS[s].group===SKILLS[r.gap[0]].group);
    const opener = x.slot==='start' && (r.gateway||r.access) && r.opens.length;
    if(x.slot==='start' && core && used && !opener) parts.push(`Also, ${gapText(core,p)}.`);
    if(x.slot==='start' && (r.gateway||r.access) && r.opens.length) parts.push('This is the best first step for you, because the other courses build on it.');
    else if(x.kind==='follow') parts.push(`It follows naturally once you finish ${nameOf(x.after)}.`);
    else if(x.e && x.e.status==='later' && x.slot==='also') parts.push(`You can take this after ${laterVia(x,p)}.`);
    if(r.interestHits.length && parts.length<3 && x.slot!=='start') parts.push(`You said you are interested in ${listJoin(r.interestHits.map(i=>D.INTERESTS[i].phrase))}.`);
    if(c.tradeContext && parts.length<3) parts.push(`You practise with examples from ${p.tradeLabel} work.`);
    if(r.f.urgency>=0.75 && has(c.tags,'short') && parts.length<3) parts.push(`You want to start working soon, and this takes about ${r.weeks} week${r.weeks>1?'s':''} at your pace.`);
    parts.push(c.promise);
    return parts.join(' ');
  }
  function listJoin(a){ return a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }
  function nameOf(id){ const c=COURSES.find(c=>c.id===id); return c?c.name:id; }
  function laterVia(x,p){
    const miss = x.e.blocks.flatMap(b=>b.type==='skill'?b.skills:b.type==='skillAny'?[b.skills.find(s=>G.teachersOf[s])]:[]);
    const teachers = [...new Set(miss.map(s=>G.teachersOf[s][0]))].map(nameOf);
    return teachers.join(' and ');
  }

  /* ---- 7. Ingestion: add a course, rebuild the graph, nothing else changes ---- */
  function addCourse(meta){
    const required = ['id','name','category','domain','stage','hours','langs','prereq','teaches','trades','promise'];
    const missing = required.filter(k=>meta[k]===undefined);
    if(missing.length) return {ok:false, missing};
    const unknown = [...meta.teaches, ...meta.prereq.all, ...meta.prereq.any].filter(s=>!SKILLS[s]);
    if(unknown.length) return {ok:false, unknownSkills:unknown};
    COURSES = COURSES.filter(c=>c.id!==meta.id).concat([meta]);
    G = buildGraph();
    return {ok:true, precededBy:G.edges.filter(e=>e.to===meta.id).map(e=>e.from), leadsTo:G.edges.filter(e=>e.from===meta.id).map(e=>e.to),
            goals:G.goalLinks.filter(l=>l.course===meta.id).map(l=>l.goal)};
  }
  function removeCourse(id){ COURSES = COURSES.filter(c=>c.id!==id); G = buildGraph(); }

  return {recommend, buildProfile, BONUS, eligibility, relevance, addCourse, removeCourse, get courses(){return COURSES;}, get graph(){return G;}, EVIDENCE, WEIGHTS};
}

function renderScreen(){
  const sc = SCREENS[S.screen];
  app().innerHTML = `
  <section class="quiz">
    ${progressHTML()}
    <h2 class="screen-title">${esc(sc.title)}</h2>
    <div class="qs">${visibleQs(sc).map(questionHTML).join('')}</div>
    <div class="actionbar">
      <button class="btn ghost" id="back">${IC.back} Back</button>
      <button class="btn primary" id="cont">${S.screen===SCREENS.length-1?'See my courses':'Continue'} ${IC.next}</button>
    </div>
  </section>`;
  bindScreen();
}
function bindScreen(){
  app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const q = findQ(b.dataset.q); const v = b.dataset.v;
    if(q.type==='single'){ S.answers[q.id]=v; }
    else {
      let cur = (S.answers[q.id]||[]).slice();
      if(cur.includes(v)) cur = cur.filter(x=>x!==v);
      else {
        if(q.exclusive && v===q.exclusive) cur=[v];
        else { cur = cur.filter(x=>x!==q.exclusive); if(q.max && cur.length>=q.max){ S.errors[q.id]=`You can choose up to ${q.max}. Remove one to add another.`; rerenderKeepScroll(); return; } cur.push(v); }
      }
      S.answers[q.id]=cur;
    }
    delete S.errors[q.id];
    rerenderKeepScroll(b.dataset.q, v);
  });
  app().querySelectorAll('select[data-q]').forEach(s=>s.onchange=()=>{ S.answers[s.dataset.q]=s.value; delete S.errors[s.dataset.q]; rerenderKeepScroll(); });
  app().querySelectorAll('input[data-q]').forEach(i=>i.oninput=()=>{ S.answers[i.dataset.q]=i.value; });
  $('#back').onclick = ()=>{ S.errors={}; S.screen--; render(); setFocusTop(); };
  $('#cont').onclick = ()=>{
    const sc = SCREENS[S.screen]; S.errors={};
    visibleQs(sc).forEach(q=>{ if(q.required && !answered(q)) S.errors[q.id] = q.type==='text' ? 'Please type your trade.' : (q.type==='single'||q.type==='select') ? 'Please choose one answer.' : 'Please choose at least one.'; });
    if(Object.keys(S.errors).length){ renderScreen(); const first=app().querySelector('.has-err'); if(first){ first.scrollIntoView({block:'center'}); const f=first.querySelector('button,select,input'); if(f) f.focus({preventScroll:true}); } return; }
    if(S.screen===SCREENS.length-1) runProcessing(); else { S.screen++; render(); setFocusTop(); }
  };
}
function findQ(id){ for(const sc of SCREENS) for(const q of sc.qs) if(q.id===id) return q; }
function rerenderKeepScroll(qid, v){
  const y = window.scrollY; renderScreen(); window.scrollTo(0,y);
  if(qid){ const el = app().querySelector(`.opt[data-q="${qid}"][data-v="${CSS.escape(v)}"]`); if(el) el.focus({preventScroll:true}); }
}

/* ---------- processing ---------- */
function runProcessing(){
  S.screen = SCREENS.length;
  const steps = ['Reading your answers','Checking what each course needs','Choosing your best path'];
  app().innerHTML = `<section class="processing" aria-live="polite">
    <img class="brand-mark" src="${LOGO}" alt="" width="64" height="38">
    <h2>Building your learning plan</h2>
    <ol class="proc-steps">${steps.map((s,i)=>`<li id="ps${i}"><span class="ps-dot"></span>${s}</li>`).join('')}</ol>
  </section>`;
  window.scrollTo(0,0);
  S.result = E.recommend(cleanAnswers());
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gap = reduce ? 150 : 650;
  steps.forEach((s,i)=>setTimeout(()=>{ const li=$('#ps'+i); if(li) li.classList.add('done'); }, gap*(i+1)));
  setTimeout(()=>{ S.screen = SCREENS.length+1; render(); setFocusTop(); }, gap*(steps.length+1));
}

/* ---------- results ---------- */
const STAGE = {foundation:'Foundation', skill:'Build skills', applied:'Apply at work'};
function diffLabel(d){ return d<=2 ? 'Beginner' : d===3 ? 'Intermediate' : 'Advanced'; }
function weeksText(c,p){ const w = Math.max(1, Math.ceil(c.hours/p.weekly)); return `${c.hours} hours, about ${w} week${w>1?'s':''} at your pace`; }
function langText(c,p){ const ok = c.langs.some(l=>p.prefLangs.includes(l)||p.readLangs.includes(l)); return esc(c.langs.join(' and ')) + (ok?'':' <span class="lang-note">Not yet in your language. A trainer can help you.</span>'); }

function courseCard(rec, featured){
  const c = rec.c, p = S.result.profile, cat = CATEGORY[c.category];
  const later = rec.e.status==='later';
  const afterNames = later ? laterNames(rec) : '';
  const tags = c.teaches.filter(s=>!p.skills.has(s)).slice(0,4).map(s=>`<li>${esc(SKILLS[s].label)}</li>`).join('');
  return `<article class="course ${featured?'featured':''}" style="--cat:${cat.color};--cat-tint:${cat.tint}" aria-labelledby="t-${c.id}">
    <div class="thumb">${thumbSVG(c)}</div>
    <div class="course-body">
      <div class="pills"><span class="pill cat">${esc(cat.label)}</span>${c.status==='planned'?'<span class="pill planned">Coming soon</span>':''}${later?`<span class="pill later">After ${esc(afterNames)}</span>`:''}</div>
      <h3 id="t-${c.id}">${esc(c.name)}</h3>
      <p class="one">${esc(c.oneLiner)}</p>
      <dl class="meta">
        <div><dt>${IC.target}<span>Level</span></dt><dd>${diffLabel(c.difficulty)}, ${esc(c.nsqf)}</dd></div>
        <div><dt>${IC.clock}<span>Time</span></dt><dd>${weeksText(c,p)}</dd></div>
        <div><dt>${IC.lang}<span>Language</span></dt><dd>${langText(c,p)}</dd></div>
      </dl>
      ${tags?`<div class="skills"><p class="mini">You will learn</p><ul class="tags">${tags}</ul></div>`:''}
      <div class="why"><p class="why-h">Why this course is for you</p><p>${esc(rec.why)}</p></div>
      <details class="modules"><summary>See the course parts (${c.modules.length})</summary><ol>${c.modules.map(m=>`<li>${esc(m)}</li>`).join('')}</ol></details>
      <div class="course-actions">
        ${later ? `<button class="btn secondary" data-save="${c.id}">Save for later</button>` : `<button class="btn primary" data-start="${c.id}">Start course ${IC.next}</button>`}
      </div>
    </div>
  </article>`;
}
function laterNames(rec){
  const miss = rec.e.blocks.flatMap(b=>b.type==='skill'?b.skills:b.type==='skillAny'?[b.skills.find(s=>E.graph.teachersOf[s])]:[]).filter(s=>!S.result.profile.skills.has(s));
  const inPlan = S.result.recs.filter(r=>r.slot!=='also').map(r=>r.c);
  const names = [...new Set(miss.map(s=>{ const t=inPlan.find(c=>c.teaches.includes(s)) || E.courses.find(c=>c.teaches.includes(s)); return t?t.name:''; }))].filter(Boolean);
  return names.join(' and ');
}

function summaryHTML(p){
  const a = p.a;
  const goals = p.goalList.filter(g=>!GOALS[g.id].implicit).map(g=>GOALS[g.id].label).join('; ');
  const status = {y1:'1st year',y2:'2nd or final year',done:'finished ITI',apprentice:'doing apprenticeship'}[a.itiStatus]||'';
  const edu = {class8:'Class 8',class10:'Class 10',class12:'Class 12',diploma:'Diploma',graduate:'Graduate',other:'Other'}[a.education]||'';
  const learn = a.learnLang==='Both' ? 'English and Hindi' : a.learnLang==='Regional' ? 'your own language' : a.learnLang;
  const rows = [
    [IC.wrench,'Trade', `${p.tradeLabel}${status?', '+status:''}`],
    [IC.cap,'Studied', edu + (a.stream==='none12' ? ' (did not study Class 12)' : a.stream?`, ${a.stream[0].toUpperCase()+a.stream.slice(1)}`:'')],
    [IC.target,'Your goals', goals],
    [IC.lang,'Languages', `Speaks ${(a.speak||[]).join(', ')}. Wants to learn in ${learn}.`],
    [IC.phone,'Phone', p.labels.phone],
    [IC.laptop,'Computer', p.labels.comp],
    [IC.spark,'AI apps', p.labels.ai],
    [IC.chat,'English at work', p.labels.eng]
  ];
  return `<dl class="summary">${rows.map(([i,k,v])=>`<div class="sum-row"><dt>${i}<span>${k}</span></dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
}

function pathHTML(){
  const recs = S.result.recs.filter(r=>r.slot!=='also');
  const order = {foundation:0, skill:1, applied:2};
  const seq = recs.slice().sort((x,y)=> (x.slot==='start'?-1:0)-(y.slot==='start'?-1:0) || order[x.c.stage]-order[y.c.stage]);
  return `<ol class="path">${seq.map((r,i)=>`<li class="path-step" style="--cat:${CATEGORY[r.c.category].color}">
      <span class="path-num">${i+1}</span>
      <div><p class="path-stage">${STAGE[r.c.stage]}</p><p class="path-name">${esc(r.c.name)}</p></div>
    </li>`).join('')}</ol>`;
}

function renderResults(){
  const R = S.result, p = R.profile; const name = (p.a.name||'').trim();
  const start = R.recs.find(r=>r.slot==='start'); const next = R.recs.filter(r=>r.slot==='next'); const also = R.recs.filter(r=>r.slot==='also');
  app().innerHTML = `
  <section class="results">
    <header class="res-head">
      <p class="eyebrow on-dark">Recommended for you</p>
      <h1>${name?esc(name)+', here is your learning plan':'Here is your learning plan'}</h1>
      <p class="lead">We matched your answers with each course: what it needs before you start, what it teaches, and how it helps your goals.</p>
    </header>

    <div class="res-grid">
      <div class="res-main">
        <h2 class="slot-h"><span class="slot-num">1</span>Start here</h2>
        ${start?courseCard(start,true):'<p class="empty">We could not find a course to start with yet.</p>'}
        ${next.length?`<h2 class="slot-h"><span class="slot-num">2</span>Next</h2><div class="cards">${next.map(r=>courseCard(r,false)).join('')}</div>`:''}
        ${also.length?`<h2 class="slot-h plain">You may also like</h2><p class="hint">Optional courses linked to your interests and goals.</p><div class="cards">${also.map(r=>courseCard(r,false)).join('')}</div>`:`<h2 class="slot-h plain">You may also like</h2><p class="hint">More courses will open for you as you finish these. Your plan updates each time.</p>`}
      </div>
      <aside class="res-side">
        <div class="side-card"><h2 class="side-h">Your path</h2><p class="hint">Take these in order. Each one prepares you for the next.</p>${pathHTML()}</div>
        <div class="side-card"><h2 class="side-h">What we understood about you</h2>${summaryHTML(p)}
          <button class="btn ghost full" id="edit">Change my answers</button></div>
      </aside>
    </div>

    <div class="res-foot">
      <button class="btn ghost" id="restart">Start again</button>
      <button class="btn link" id="staff" aria-expanded="${S.staff}">${S.staff?'Hide':'For staff:'} how this was matched</button>
    </div>
    <div id="staffpanel">${S.staff?staffHTML():''}</div>
  </section>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mh"><div class="modal-card"><button class="icon-btn" id="mclose" aria-label="Close">${IC.close}</button><h2 id="mh"></h2><p id="mb"></p><button class="btn primary" id="mok">OK</button></div></div>`;
  bindResults();
}
function bindResults(){
  $('#edit').onclick = ()=>{ S.screen=0; render(); setFocusTop(); };
  $('#restart').onclick = ()=>{ if(S.simulated){ E.removeCourse(NEW_COURSE_DEMO.id); S.simulated=false; } S.answers={}; S.result=null; S.screen=-1; S.staff=false; render(); setFocusTop(); };
  $('#staff').onclick = ()=>{ S.staff=!S.staff; renderResults(); if(S.staff) $('#staffpanel').scrollIntoView({block:'start'}); };
  app().querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>openModal(b.dataset.start,false));
  app().querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>openModal(b.dataset.save,true));
  const sim = $('#simbtn'); if(sim) sim.onclick = toggleSim;
}
function openModal(id, later){
  const c = E.courses.find(x=>x.id===id); const m=$('#modal');
  $('#mh').textContent = later ? 'Saved to your plan' : (c.status==='planned' ? 'You are on the list' : 'Course added');
  $('#mb').textContent = later ? `${c.name} is saved. It opens once you finish the course before it.` :
    c.status==='planned' ? `${c.name} is coming soon. We will tell you when the first lesson opens.` : `${c.name} is added to your courses. In the full platform, this opens your first lesson.`;
  m.hidden=false; const last=document.activeElement; $('#mok').focus();
  const close=()=>{ m.hidden=true; if(last) last.focus(); };
  $('#mok').onclick=close; $('#mclose').onclick=close; m.onclick=e=>{ if(e.target===m) close(); };
  m.onkeydown=e=>{ if(e.key==='Escape') close(); };
}

/* ---------- staff panel: transparency for product and tech teams ---------- */
function staffHTML(){
  const R = S.result, p = R.profile;
  const statusLabel = {eligible:'Eligible now', later:'Eligible later', excluded:'Not eligible'};
  const blockText = b => b.type==='skill' ? 'Needs: '+b.skills.map(s=>SKILLS[s].label).join(', ')
    : b.type==='skillAny' ? 'Needs one of: '+b.skills.map(s=>SKILLS[s].label).join(', ')
    : b.type==='education' ? 'Education below '+b.need : b.type==='experience' ? 'Needs job experience'
    : b.type==='device' ? 'Needs computer access' : b.type==='language' ? 'Learner reads none of: '+b.langs.join(', ') : 'Already has these skills (confirm with a short check)';
  const recIds = new Set(R.recs.map(r=>r.c.id));
  const rows = R.rows.slice().sort((x,y)=>y.r.score-x.r.score).map(x=>{
    const f = x.r.f; const top = Object.entries(f).sort((a,b)=>b[1]*E.WEIGHTS[b[0]]-a[1]*E.WEIGHTS[a[0]]).slice(0,3).map(([k,v])=>`${k} ${v.toFixed(2)}`).join(', ');
    const bonus = [x.r.riskHits.length?'risk':'', x.r.access?'access':'', x.r.gateway?'gateway':''].filter(Boolean).join(', ');
    const slot = R.recs.find(r=>r.c.id===x.c.id);
    return `<tr class="${recIds.has(x.c.id)?'hl':''}"><td><strong>${esc(x.c.id)}</strong><br><span class="muted">${esc(x.c.name)}</span></td>
      <td>${statusLabel[x.e.status]}</td><td class="num">${x.r.score.toFixed(3)}</td>
      <td>${slot?slot.slot:''}</td>
      <td>${x.e.blocks.length?x.e.blocks.map(blockText).map(esc).join('<br>'):'None'}</td>
      <td>${esc(top)}${bonus?`<br><span class="muted">Bonus: ${bonus}</span>`:''}</td></tr>`;
  }).join('');
  const levels = Object.entries(p.levels).map(([t,l])=>`<span class="kv"><b>${t==='ai'?'AI ladder level':'Communication ladder level'}</b> ${l}</span>`).join('');
  const held = [...p.skills].map(s=>`<li>${esc(SKILLS[s].label)}</li>`).join('') || '<li>None yet</li>';
  const edges = E.graph.edges; const uniq = [...new Set(edges.map(e=>e.from+' > '+e.to))];
  return `<div class="staff">
    <h2>How this was matched</h2>
    <p class="hint">Visible to staff only. Learners never see scores or skill codes.</p>
    <div class="staff-grid">
      <div class="side-card"><h3>Learner profile</h3><div class="kvs">${levels}</div>
        <p class="mini">Skills shown by answers</p><ul class="tags small">${held}</ul>
        <p class="mini">Communication needs</p><p>${esc(p.commNeeds.join('; ')||'None flagged')}</p>
        <p class="mini">Goal needs no course can serve yet</p><p>${esc(R.unserved.map(s=>SKILLS[s].label).join('; ')||'None')}</p></div>
      <div class="side-card"><h3>Knowledge graph</h3>
        <p>${E.courses.length} courses, ${Object.keys(SKILLS).length} skills, ${uniq.length} course-to-course links derived from prerequisites. No link is typed by hand.</p>
        <p class="mini">Skills no course teaches yet</p><p>${esc(E.graph.orphanSkills.map(s=>SKILLS[s].label).join('; ')||'None')}</p>
        <p class="mini">Ingestion test</p>
        <p>${S.simulated?'Simulated course <b>CV and Job Application Basics</b> is loaded. The graph and this plan were rebuilt from its metadata alone.':'Add a new course from metadata only. The questionnaire does not change.'}</p>
        <button class="btn secondary" id="simbtn">${S.simulated?'Remove simulated course':'Add simulated course'}</button>
        ${S.simulated?`<p class="mini">Auto-placed</p><p>${esc(simInfo())}</p>`:''}</div>
    </div>
    <div class="table-wrap"><table class="staff-table"><thead><tr><th>Course</th><th>Eligibility</th><th>Score</th><th>Slot</th><th>Blocked by</th><th>Top factors</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Weights: ${Object.entries(E.WEIGHTS).map(([k,v])=>`${k} ${v}`).join(', ')}. Bonuses: ${Object.entries(E.BONUS).map(([k,v])=>`${k} ${k==='seriesOrder'?'-':'+'}${v}`).join(', ')}.</p>
  </div>`;
}
let SIM = null;
function toggleSim(){
  if(S.simulated){ E.removeCourse(NEW_COURSE_DEMO.id); S.simulated=false; SIM=null; }
  else { SIM = E.addCourse(JSON.parse(JSON.stringify(NEW_COURSE_DEMO))); S.simulated=true; }
  S.result = E.recommend(cleanAnswers()); renderResults(); $('#staffpanel').scrollIntoView({block:'start'});
}
function simInfo(){
  if(!SIM) return ''; const nm = id => (E.courses.find(c=>c.id===id)||{}).name||id;
  return `Comes after: ${[...new Set(SIM.precededBy)].map(nm).join(', ')||'nothing (no prerequisite courses)'}. Leads to: ${[...new Set(SIM.leadsTo)].map(nm).join(', ')||'no current course'}. Serves goals: ${SIM.goals.map(g=>GOALS[g].label).join(', ')}.`;
}

/* ---------- router ---------- */
function render(){
  document.body.dataset.view = S.screen<0 ? 'welcome' : S.screen<SCREENS.length ? 'quiz' : S.screen===SCREENS.length ? 'processing' : 'results';
  if(S.screen<0) renderWelcome();
  else if(S.screen<SCREENS.length) renderScreen();
  else if(S.screen>SCREENS.length) renderResults();
}
render();

</script>
</body>
</html>
