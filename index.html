<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Mentor - Picture-based Career Test</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
 --bg:#F4F5FA;--paper:#FFFFFF;--ink:#1B1D3A;--soft:#5E6283;--line:#E2E4EF;
 --pri:#3F3D9E;--pri-ink:#FFFFFF;--navy:#0F1F5C;--blue:#2546E8;--gold:#F5B301;--gold-ink:#1B1D3A;
 --t1:#ECEBFB;--t2:#E0F3EC;--t3:#FDEBDD;--t4:#E3ECFB;--teal:#11806A;
 --pw-vc:#0C8599;--pw-wc:#B5179E;--pw-ai:#3F3D9E;--pw-ds:#D9480F;
 --warn-bg:#FFF4E5;--warn:#8A4B00;--ok:#1F9D55;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--serif:Georgia,"Times New Roman",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#10121C;--paper:#191C2A;--ink:#E9EAF4;--soft:#A3A7C2;--line:#2C3045;--pri:#8B89F0;--pri-ink:#0E0F24;
 --t1:#26254A;--t2:#16352D;--t3:#3A2A1E;--t4:#1D2A48;--teal:#4FD1B0;--warn-bg:#3A2A12;--warn:#FFC078;
 --pw-vc:#3BC9DB;--pw-wc:#F06FD8;--pw-ai:#A5A3FF;--pw-ds:#FF922B;}}
:root[data-theme="dark"]{--bg:#10121C;--paper:#191C2A;--ink:#E9EAF4;--soft:#A3A7C2;--line:#2C3045;--pri:#8B89F0;--pri-ink:#0E0F24;
 --t1:#26254A;--t2:#16352D;--t3:#3A2A1E;--t4:#1D2A48;--teal:#4FD1B0;--warn-bg:#3A2A12;--warn:#FFC078;--pw-vc:#3BC9DB;--pw-wc:#F06FD8;--pw-ai:#A5A3FF;--pw-ds:#FF922B;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--blue));display:grid;place-items:center;color:#fff}
.logo svg{width:17px;height:17px}
.brand{font-weight:700;white-space:nowrap}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;color:var(--soft);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;background:var(--pri);color:var(--pri-ink);display:inline-flex;align-items:center;gap:8px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.line{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px}
.fine{font-size:13.5px;color:var(--soft)}
/* hero */
.hero{border-radius:22px;background:linear-gradient(120deg,#0E1A52 0%,#1B2F9E 60%,#2546E8 100%);color:#fff;padding:34px 30px;display:grid;gap:24px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5vw,46px);font-weight:700;letter-spacing:-.5px}
.hero h1 span{display:block;color:var(--gold)}
.hero p{color:#D7DCF5;max-width:52ch}
.hero .fine{color:#B8C0EA}
.mini{background:#fff;color:#1B1D3A;border-radius:14px;padding:14px}
.mini .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mini .tiles div{border:1px solid #E2E4EF;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:600}
.mini .tiles i,.mini .tiles svg{display:block;margin:0 auto 4px;width:20px;height:20px;color:#3F3D9E}
.steps{display:flex;align-items:center;gap:8px;padding:14px 18px;margin:16px 0}
.steps .s{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.steps .s b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.steps .s.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .s.now b{border-color:var(--gold);color:var(--ink)}
.steps .ln{flex:1;height:2px;background:var(--line);min-width:10px}
.expect{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.expect .card{padding:16px}
.expect h3{font-size:15.5px;margin:10px 0 4px}
.expect p{margin:0;font-size:14px;color:var(--soft)}
.chipt{font-size:12px;font-weight:700;background:var(--t3);color:var(--warn);border-radius:6px;padding:2px 7px;float:right}
.ico{width:42px;height:42px;border-radius:12px;background:var(--t4);display:grid;place-items:center;color:var(--pri)}
/* layout with side panel */
.wrap{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
.side{padding:18px;position:sticky;top:76px}
.side h3{font-size:16px;margin-bottom:8px}
.jbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.jbar b{display:block;height:100%;background:var(--pri);transition:width .3s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px;margin-top:12px}
.kv dt{color:var(--soft)}.kv dd{margin:0;text-align:right;font-weight:600}
/* chat */
.chat{padding:18px;min-height:480px}
.msg{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.av{flex:0 0 34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center}
.av svg{width:17px;height:17px}
.bub{background:var(--bg);border-radius:14px;padding:10px 14px;max-width:560px}
.me{justify-content:flex-end}.me .bub{background:var(--pri);color:var(--pri-ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:8px 0 0 44px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:8px}
.opt .ic{width:32px;height:32px;border-radius:9px;background:var(--t1);display:grid;place-items:center;color:var(--pri)}
.opt .ic svg{width:18px;height:18px}
.opt:hover{border-color:var(--pri)}
.invite{margin:10px 0 0 44px;padding:18px}
.invite dl{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:14.5px;margin:14px 0}
.invite dt{color:var(--soft);font-weight:600}
.invite dd{margin:0}
/* test */
.test{padding:0;overflow:hidden}
.thead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.thead h2{font-size:17px}
.thead small{display:block;color:var(--teal);font-weight:700;font-size:12.5px;letter-spacing:.3px}
.thead .qn{margin-left:auto;font-weight:700;color:var(--pri);font-size:14px}
.tprog{height:4px;background:var(--line)}.tprog b{display:block;height:100%;background:var(--teal);transition:width .3s}
.tbody{padding:26px 18px 30px;text-align:center;min-height:430px}
.tbody h1{font-size:clamp(22px,3.5vw,28px)}
.listen{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;margin:10px 0 18px}
.listen svg{width:16px;height:16px}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:860px;margin:0 auto}
.pic{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 8px 12px;font-weight:700;display:flex;flex-direction:column;gap:10px;align-items:stretch;transition:border-color .15s,transform .15s}
.pic .art{height:118px;border-radius:12px;display:grid;place-items:center;position:relative}
.pic .art span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;color:#2B2A7A;font-size:36px}
:root[data-theme="dark"] .pic .art span{background:rgba(255,255,255,.1);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pic .art span{background:rgba(255,255,255,.1);color:var(--ink)}}
.pic .art svg{width:44px;height:44px;stroke-width:1.6}
.pic:nth-child(1) .art{background:var(--t1)}.pic:nth-child(2) .art{background:var(--t2)}.pic:nth-child(3) .art{background:var(--t3)}.pic:nth-child(4) .art{background:var(--t4)}
.pic:hover{border-color:var(--pri)}
.pic.sel{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri) inset}
.scene{font-size:46px;width:220px;height:120px;border-radius:16px;background:var(--t3);margin:0 auto 14px;display:grid;place-items:center;color:#2B2A7A}
.scene svg{width:54px;height:54px;stroke-width:1.5}
:root[data-theme="dark"] .scene{color:var(--ink)}
.sub{color:var(--soft);margin-top:4px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:620px;margin:10px auto 0}
.scale button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 4px;font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:6px}
.scale .f{font-size:26px;line-height:1}
.scale button.sel{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri) inset}
.tfoot{display:flex;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.back{border:0;background:none;color:var(--pri);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.back svg{width:16px;height:16px}
.intro .big{width:72px;height:72px;border-radius:18px;background:var(--t2);display:grid;place-items:center;margin:30px auto 12px;color:var(--teal)}
.intro .big svg{width:34px;height:34px}
.intro .pt{color:var(--teal);font-weight:800;font-size:13px;letter-spacing:.5px}
.intro p{color:var(--soft);max-width:52ch;margin:10px auto 16px}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.pills span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
/* report */
.rhead{display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden}
.rhead .l{padding:24px}
.rhead .r{padding:24px;background:linear-gradient(120deg,#0E1A52,#2546E8);color:#fff}
.rhead .r h2{font-size:clamp(26px,4vw,34px);margin:4px 0 8px}
.lab{font-size:12.5px;font-weight:800;letter-spacing:.6px;color:var(--teal)}
.rhead .r .lab{color:#C9D1FF}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tchips span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid2 .card{padding:20px}
.grid2 h3{font-size:20px}
.bars{display:grid;gap:12px;margin-top:14px}
.bar .h{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px}
.bar .h small{font-weight:500;color:var(--soft)}
.bar .tr{height:8px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.bar .tr b{display:block;height:100%;background:var(--pri);border-radius:4px}
.bar.dim .tr b{opacity:.45}
.means{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px}
.means li{padding-left:22px;position:relative}
.means li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.sect{font-size:22px;margin:28px 0 12px}
.tracks{display:grid;gap:14px}
.trk{padding:18px 20px;display:grid;grid-template-columns:1fr 170px;gap:16px;border-left:6px solid var(--c)}
.trk .pw{font-size:12.5px;font-weight:800;letter-spacing:.5px;color:var(--c)}
.trk h3{font-size:21px;margin:4px 0 2px}
.trk .roles{color:var(--soft);font-size:14px}
.trk .why{background:var(--bg);border-left:3px solid var(--teal);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.trk .fit small{display:block;font-size:12px;font-weight:800;color:var(--soft);letter-spacing:.5px}
.trk .fit b{font-size:30px;color:var(--pri)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:middle}
.flag{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.next{padding:18px 20px;margin-top:16px}
.next ol{margin:8px 0 0;padding-left:20px}
details{margin-top:16px;padding:14px 18px}
summary{cursor:pointer;font-weight:700}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:520px;padding:22px}
.modal h2{font-family:var(--serif);font-size:22px}
.spec{padding:24px}
.spec h2{font-size:21px;margin:26px 0 8px}.spec h2:first-child{margin-top:0}
.spec p,.spec li{font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.course{margin-top:10px;font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.mcs{margin:8px 0 0;padding-left:20px;font-size:13.5px}.mcs li{margin:2px 0}.mcs li.hl b{color:var(--pri)}
.hidden{display:none}
i[data-lucide]{font-style:normal}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static;order:-1}.side .kv,.side h3.ans{display:none}
 .hero{grid-template-columns:1fr;padding:26px 20px}.expect{grid-template-columns:1fr 1fr}.pics{grid-template-columns:1fr 1fr}
 .rhead,.grid2{grid-template-columns:1fr}.trk{grid-template-columns:1fr}}
@media (max-width:560px){.steps .s span{display:none}.expect{grid-template-columns:1fr}.opts{margin-left:0}.invite{margin-left:0}
 .scale{grid-template-columns:repeat(5,1fr);gap:4px}.scale button{font-size:11.5px;padding:10px 2px}.invite dl{grid-template-columns:1fr}
 .pic .art{height:96px}.pic .art span{width:68px;height:68px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
 <div class="logo"><i data-lucide="message-square-heart">✦</i></div><div class="brand">Career Mentor</div>
 <nav class="tabs" role="tablist"><button role="tab" id="tab-test" aria-selected="true" onclick="showTab('test')">Test</button><button role="tab" id="tab-spec" aria-selected="false" onclick="showTab('spec')">How it works</button></nav>
</div></header>
<main><section id="view-test"></section><section id="view-spec" class="hidden"></section></main>
<div id="modal"></div>
<script>
// ===== CAREER MENTOR ENGINE v0.2 (picture-based, static) =====

 AI:{name:"Applied AI",color:"--pw-ai"},DS:{name:"Data Science",color:"--pw-ds"}};

 ["T06","VC","Micro-SaaS & Freelance Building",["EGN","SYB","PDR"],["Freelance app developer","Micro-SaaS founder","Digital agency owner"]],

 ["T15","AI","AI-Enabled Business Operations",["SOP","APS","OPM"],["AI operations analyst","AI-enabled operations executive","Process improvement associate"]],
 ["T16","AI","AI Implementation & Customer Success",["SST","PDV","APS"],["AI implementation associate","AI solutions support engineer","Customer success (AI products)"]],
 ["T17","AI","AI Evaluation & Responsible AI",["AIV","PIA","OPM"],["AI evaluator","Model QA analyst","Responsible AI associate"]],
 ["T18","AI","Sector AI Applications",["PIA","PDV","EGN"],["AI field facilitator (agri, health, education)","EdTech AI specialist","AI adoption trainer for small businesses"]],

function score(a,bg,secs){
 // a: {int:[idx x12], sit:[idx x10], rated:[1-5 x3], pos:[]}
 const shown={R:0,I:0,A:0,S:0,E:0,C:0}, pick={R:0,I:0,A:0,S:0,E:0,C:0};
 INT_Q.forEach((q,i)=>{q.forEach(o=>shown[o.k]++); pick[q[a.int[i]].k]++;});
 const riasec={}; for(const k in shown) riasec[k]=pick[k]/shown[k]; // 0..1
 const tp={O:0,C:0,E:0,A:0}; SIT_Q.forEach((q,i)=>tp[q.opts[a.sit[i]].k]++);
 const big5={}; for(const k in tp) big5[k]=Math.min(1,tp[k]/SIT_Q.length*2); // share*2, 0.5 = average
 big5.N=RATED.reduce((s,r,i)=>s+(r[1]?6-a.rated[i]:a.rated[i]),0)/RATED.length; big5.N=(big5.N-1)/4;
 // quality
 const flags=[]; const positions=[...a.int,...a.sit]; const cnt={}; positions.forEach(p=>cnt[p]=(cnt[p]||0)+1);
 if(Math.max(...Object.values(cnt))/positions.length>=CFG.samePos) flags.push("Most answers were in the same position");
 if(secs!=null && secs/(positions.length+RATED.length)<CFG.minSecPerItem) flags.push("The test was finished very fast");
 const mean=Object.values(riasec).reduce((x,y)=>x+y,0)/6; const c={}; for(const k in riasec)c[k]=riasec[k]-mean;
 const prof={};
 for(const id in PROFILES){const p=PROFILES[id]; let I=0;[3,2,1].forEach((w,i)=>I+=w*c[p.code[i]]); I=I/6*2.5;
  let P=0,W=0; for(const t in p.b5){const tg=p.b5[t],x=big5[t],w=t==="O"?0.5:1; const m=tg==="H"?(x-0.5)*2:tg==="L"?(0.5-x)*2:1-4*Math.abs(x-0.5); P+=w*m;W+=w;} P/=W;
  let sc=CFG.wInterest*I+CFG.wPersonality*P; if(GOAL_MOTIVE[bg.goal]?.includes(id))sc+=CFG.motiveBoost; if(bg.priority==="portfolio"&&["SYB","STC","CEX","ACC"].includes(id))sc+=CFG.motiveBoost/2; prof[id]=sc;}
 const ranked=Object.keys(prof).sort((x,y)=>prof[y]-prof[x]); const [p1,p2]=ranked; const gap=prof[p1]-prof[p2];
 const spread=Math.max(...Object.values(riasec))-Math.min(...Object.values(riasec));
 const adj=ADJ.includes(p1+"-"+p2)||ADJ.includes(p2+"-"+p1);
 const blend=(spread<CFG.flatInterest||prof[p1]<CFG.exploreTop)?"Exploratory":gap>=CFG.singleGap?"Single":adj?"Adjacent":"Split-Drive";
 const pw={}; ranked.forEach(id=>pw[id]=0);
 if(blend==="Single"){pw[p1]=1;pw[p2]=0.35;pw[ranked[2]]=0.15;} else if(blend==="Exploratory"){pw[p1]=1;pw[p2]=0.8;pw[ranked[2]]=0.6;pw[ranked[3]]=0.4;} else {pw[p1]=1;pw[p2]=0.9;pw[ranked[2]]=0.2;}
 const tscore=TRACKS.map(t=>{let v=0;t[3].forEach((pid,i)=>v+=(3-i)*pw[pid]); let m=1; const why=[];
  if(STREAM_BOOST[bg.stream]?.includes(t[0])){m+=CFG.streamBoost;why.push("builds on your course");}
  for(const key of ["goal","priority"]){const r=RULES[key][bg[key]]; if(r&&r[0].includes(t[0])){m*=r[1];why.push(r[2]);}}
  if(bg.computer==="c0"&&["T01","T02","T03","T20","T21","T22"].includes(t[0])){m*=0.8;why.push("stretch");}
  if(bg.computer==="c3"&&["T01","T02","T21","T22"].includes(t[0])){m*=1.1;why.push("uses your coding start");}
  return {t,v:v*m,why,via:t[3].filter(pid=>pw[pid]>0.3)};}).sort((x,y)=>y.v-x.v);
 const pick3=[],per={}; const lim=(blend==="Exploratory"||bg.priority==="explore")?1:2;
 const can=x=>(per[x.t[1]]||0)<lim, add=x=>{pick3.push(x);per[x.t[1]]=(per[x.t[1]]||0)+1;};
 if(blend==="Split-Drive"){add(tscore.find(x=>x.t[3][0]===p1)||tscore[0]); const s2=tscore.find(x=>x.t[3].includes(p2)&&!pick3.includes(x)&&can(x)); if(s2)add(s2);}
 for(const x of tscore){if(pick3.length>=3)break; if(!pick3.includes(x)&&can(x))add(x);}
 const top=tscore[0].v; pick3.forEach(x=>x.fit=x.v>=0.75*top&&x.t[3].slice(0,2).includes(p1)?"High":"Medium");
 return {riasec,big5,prof,ranked,blend,gap,spread,flags,tracks:pick3,allTracks:tscore};
}

 else if(st.int.some(x=>x==null))go("p1intro"); else if(st.sit.some(x=>x==null))go("p2intro"); else if(st.rated.some(x=>x==null))go("p3",0); else go("report");}
function qOpts(q){return q.dep?(q.opts[st.bg[q.dep]]||[]):q.opts;}
function chat(){
 const bot=t=>`<div class="msg"><div class="av">${ic("sparkles")}</div><div class="bub">${t}</div></div>`;
 const me=t=>`<div class="msg me"><div class="bub">${esc(t)}</div></div>`;
 let h=`<div class="card chat"><div class="fine" style="text-align:center;margin-bottom:8px">Career counselling started</div>`+bot(`Hi, welcome to Career Counselling! I have ${QUICK.length} quick questions so I can make the best recommendations. You can pause anytime and continue later.`);
 for(let i=0;i<QUICK.length;i++){const q=QUICK[i],a=st.bg[q.id];h+=bot(esc(q.q));
  if(a){h+=me(qOpts(q).find(o=>o[0]===a)?.[1]||a);continue;}
  h+=`<div class="opts">${qOpts(q).map(o=>`<button class="opt" onclick="answer('${q.id}','${o[0]}')"><span class="ic">${ic(o[2])}</span>${esc(o[1])}</button>`).join("")}</div>`;break;}
 if(Object.keys(st.bg).length===QUICK.length){
  h+=bot("Thank you. The last step is a short picture-based test. Your career report and three course tracks will be ready right after.")+
  `<div class="card invite"><div style="display:flex;gap:12px;align-items:center"><div class="ico" style="background:var(--t2);color:var(--teal)">${ic("image")}</div><div><b>Picture-based career test</b><div class="fine">Interests and behaviour</div></div></div>
  <dl><dt>What it covers</dt><dd>What you enjoy (interests) and how you work (behaviour)</dd><dt>How it works</dt><dd>Tap the picture that fits you best. Very little reading, and each question can be read aloud.</dd><dt>Duration</dt><dd>8-10 minutes, ${INT_Q.length+SIT_Q.length+RATED.length} questions</dd></dl>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="go('p1intro')">Start the test ${ic("arrow-right","→")}</button><button class="btn line" onclick="go('intro')">Do it later</button></div></div>`;}
 h+=`<div id="chatEnd"></div><div style="margin-top:14px;display:flex;gap:10px">${Object.keys(st.bg).length?`<button class="back" onclick="undoChat()">${ic("arrow-left","←")} Change last answer</button>`:""}</div></div>`;
 return h;}
function answer(id,v){st.bg[id]=v;if(id==="learner")delete st.bg.stream;save();render();}
function undoChat(){const ks=QUICK.map(q=>q.id).filter(k=>st.bg[k]);if(ks.length){delete st.bg[ks[ks.length-1]];save();render();}}
function head(part,sub,qn,total,pct){return `<div class="thead"><div><h2>Picture-based career test</h2><small>PART ${part} OF 2 · ${sub}</small></div>${qn?`<span class="qn">Question ${qn} of ${total}</span>`:""}<button class="btn line" style="padding:6px 14px;font-size:14px" onclick="go('intro')">${ic("pause","⏸")} Save and pause</button></div><div class="tprog"><b style="width:${pct}%"></b></div>`;}
const total2=()=>SIT_Q.length+RATED.length;
function testCard(){
 const s=st.stage; let h=`<div class="card test">`;
 if(s==="p1intro"||s==="p2intro"){const p1=s==="p1intro";
  h+=head(p1?1:2,p1?"WHAT YOU ENJOY":"HOW YOU WORK",0,0,p1?0:100)+`<div class="tbody intro"><div class="big">${ic(p1?"heart":"users")}</div><div class="pt">PART ${p1?1:2} OF 2</div><h1>${p1?"What you enjoy":"How you work"}</h1>
  <p>${p1?"You'll see four pictures each time. Tap the one you'd enjoy doing most. Go with your first choice.":"Now you'll see a situation. Tap what you would most likely do. A few questions ask how much a sentence sounds like you."}</p>
  <div class="pills"><span>Tap a picture</span><span>${p1?INT_Q.length:total2()} questions</span><span>${p1?"4-5":"4-5"} min</span></div>
  <button class="btn" onclick="go('${p1?"p1":"p2"}',0)">Start Part ${p1?1:2} ${ic("arrow-right","→")}</button></div><div class="tfoot fine">There are no right or wrong answers</div></div>`;return h;}
 if(s==="p1"){const q=INT_Q[st.qi];
  h+=head(1,"WHAT YOU ENJOY",st.qi+1,INT_Q.length,st.qi/INT_Q.length*100)+`<div class="tbody"><h1>Which would you enjoy most?</h1>
  <button class="listen" onclick="speak('Which would you enjoy most? '+${esc(JSON.stringify(q.map(o=>o.label).join(", or ")))})">${ic("volume-2","🔊")} Listen</button>
  <div class="pics" role="radiogroup" aria-label="Which would you enjoy most?">${q.map((o,i)=>`<button class="pic ${st.int[st.qi]===i?"sel":""}" role="radio" aria-checked="${st.int[st.qi]===i}" onclick="pickP1(${i})"><div class="art"><span>${ic(o.icon,o.emo)}</span></div>${esc(o.label)}</button>`).join("")}</div></div>`;}
 if(s==="p2"){const q=SIT_Q[st.qi];
  h+=head(2,"HOW YOU WORK",st.qi+1,total2(),st.qi/total2()*100)+`<div class="tbody"><div class="scene">${ic(q.icon)}</div><h1>${esc(q.q)}</h1>
  <div class="sub">What would you most likely do? <button class="listen" style="margin:0 0 0 6px" onclick="speak(${esc(JSON.stringify(q.q+" What would you most likely do? "+q.opts.map(o=>o.label).join(", or ")))})">${ic("volume-2","🔊")} Listen</button></div>
  <div class="pics" style="margin-top:18px" role="radiogroup" aria-label="${esc(q.q)}">${q.opts.map((o,i)=>`<button class="pic ${st.sit[st.qi]===i?"sel":""}" role="radio" aria-checked="${st.sit[st.qi]===i}" onclick="pickP2(${i})"><div class="art"><span>${ic(o.icon)}</span></div>${esc(o.label)}</button>`).join("")}</div></div>`;}
 if(s==="p3"){const r=RATED[st.qi];
  h+=head(2,"HOW YOU WORK",SIT_Q.length+st.qi+1,total2(),(SIT_Q.length+st.qi)/total2()*100)+`<div class="tbody"><div class="scene" style="background:var(--t1)">${ic(r[2])}</div><h1>${esc(r[0])}</h1>
  <div class="sub">How much does this sound like you? <button class="listen" style="margin:0 0 0 6px" onclick="speak(${esc(JSON.stringify(r[0]+" How much does this sound like you?"))})">${ic("volume-2","🔊")} Listen</button></div>
  <div class="scale" role="radiogroup">${FACES.map((f,i)=>`<button class="${st.rated[st.qi]===i+1?"sel":""}" role="radio" aria-checked="${st.rated[st.qi]===i+1}" onclick="pickP3(${i+1})"><span class="f" aria-hidden="true">${f[0]}</span>${f[1]}</button>`).join("")}</div></div>`;}
 h+=`<div class="tfoot"><button class="back" onclick="backQ()">${ic("arrow-left","←")} Back</button><span class="fine">There are no right or wrong answers</span></div></div>`;return h;}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-IN";u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
let lock=false;
function adv(after){lock=true;render();setTimeout(()=>{lock=false;after();},220);}
function pickP1(i){if(lock)return;st.int[st.qi]=i;save();adv(()=>st.qi<INT_Q.length-1?go("p1",st.qi+1):go("p2intro"));}
function pickP2(i){if(lock)return;st.sit[st.qi]=i;save();adv(()=>st.qi<SIT_Q.length-1?go("p2",st.qi+1):go("p3",0));}
function pickP3(v){if(lock)return;st.rated[st.qi]=v;save();adv(()=>{if(st.qi<RATED.length-1)go("p3",st.qi+1);else{st.secs=(Date.now()-(st.t0||Date.now()))/1000;go("report");}});}
function backQ(){const s=st.stage;if(s==="p1")st.qi>0?go("p1",st.qi-1):go("p1intro");else if(s==="p2")st.qi>0?go("p2",st.qi-1):go("p2intro");else if(s==="p3")st.qi>0?go("p3",st.qi-1):go("p2",SIT_Q.length-1);}
const band=(x,hi,mid)=>x>=hi?"Strong":x>=mid?"Growing":"Emerging";
function report(){
 const r=score({int:st.int,sit:st.sit,rated:st.rated},st.bg,st.secs);
 const p1=PROFILES[r.ranked[0]],p2=PROFILES[r.ranked[1]];
 const per={C:r.big5.C,E:r.big5.E,A:r.big5.A,O:r.big5.O,Calm:1-r.big5.N};
 const perS=Object.entries(per).sort((a,b)=>b[1]-a[1]); const topTraits=perS.slice(0,2).map(x=>TRAIT[x[0]][0]);
 const ria=Object.entries(r.riasec).sort((a,b)=>b[1]-a[1]);
 const typeName=r.blend==="Single"?p1.type:r.blend==="Exploratory"?"The Explorer":`${p1.type} + ${p2.type.replace("The ","")}`;
 const typeDesc=r.blend==="Exploratory"?"You have many interests and no single direction stands out yet. That is normal at this stage.":p1.desc;
 const tracks=r.tracks.map(x=>{const t=x.t,pw=PATHWAYS[t[1]];
  const lead=PROFILES[t[3][0]].code; const topL=ria.find(([k])=>lead.includes(k))?.[0]||ria[0][0];
  const extra=x.why.filter(w=>w!=="stretch"); const stretch=x.why.includes("stretch");
  const why=[RIA_WHY[topL],...extra.map(w=>w[0].toUpperCase()+w.slice(1)+".")].join(" ");
  return `<article class="card trk" style="--c:var(${pw.color})"><div><div class="pw">${esc(pw.name.toUpperCase())}</div><h3>${esc(t[2])}${stretch?'<span class="tag">Stretch</span>':""}</h3><div class="roles">${t[4].map(esc).join(" · ")}</div>
  <div class="why">${esc(why)}${stretch?" Start with the computer basics module first.":""}</div>${courseBlock(t)}</div>
  <div class="fit"><small>FIT</small><b>${x.fit}</b><div class="fine">Suits: ${[...new Set(x.via)].map(id=>PROFILES[id].type).join(", ")||p1.type}</div></div></article>`;}).join("");
 const first=r.tracks[0].t;
 const next={Single:[`Start the ${PATHWAYS[first[1]].name} pathway with ${first[2]}.`,"Talk to one person working in this field about their day.","Finish one small project in your first month."],
  Adjacent:[`Start with ${first[2]}, then add the second track for a combined skill set.`,"Pick projects that use both of your strong sides.","Discuss the overlap roles with your Career Mentor."],
  "Split-Drive":["Try the first two tracks for two weeks each before you decide.","Notice which one gives you more energy, not just which is easier.","Discuss the result with a counsellor and your family."],
  Exploratory:["Try the intro lessons of all three tracks.","Note what you enjoyed and what felt boring.","Retake this test after a month of exploring."]}[r.blend];
 const d=new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
 return `${r.flags.length?`<div class="flag"><b>Your results may not be accurate.</b> ${r.flags.join(". ")}. Please retake the test at your own pace.</div>`:""}
 <div class="card rhead"><div class="l"><div class="lab">CAREER REPORT</div><h2 style="font-size:28px;margin:6px 0">Your career report</h2><div class="fine">Prepared on ${d} · ${esc(r.blend)} result</div><p class="fine" style="margin-top:12px">${BLEND_TXT[r.blend]}</p></div>
 <div class="r"><div class="lab">YOUR TYPE</div><h2>${esc(typeName)}</h2><div>${esc(typeDesc)}</div><div class="tchips">${topTraits.map(t=>`<span>${t}</span>`).join("")}<span>${RIA_LABEL[ria[0][0]]}</span></div></div></div>
 <div class="grid2"><div class="card"><h3>Personality</h3><div class="fine">How you tend to work, from Part 2.</div><div class="bars">${perS.map(([k,v])=>`<div class="bar"><div class="h">${TRAIT[k][0]}<small>${band(v,.65,.4)}</small></div><div class="tr"><b style="width:${Math.max(4,Math.round(v*100))}%"></b></div></div>`).join("")}</div>
  <h3 style="font-size:16px;margin-top:18px">What this means at work</h3><ul class="means">${perS.slice(0,2).map(([k])=>`<li><b>${TRAIT[k][0]}.</b> ${TRAIT[k][1]}</li>`).join("")}</ul></div>
 <div class="card"><h3>Areas of interest</h3><div class="fine">What you enjoy, from Part 1. Your top three are highlighted.</div><div class="bars">${ria.map(([k,v],i)=>`<div class="bar ${i>2?"dim":""}"><div class="h">${RIA_LABEL[k]}<small>${band(v,.5,.25)}</small></div><div class="tr"><b style="width:${Math.max(4,Math.round(v*100))}%"></b></div></div>`).join("")}</div></div></div>
 <h2 class="sect">Your 3 recommended course tracks</h2><div class="tracks">${tracks}</div>
 <div class="card next"><b>Next steps</b><ol>${next.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
 <p class="fine" style="margin-top:14px">This is a guide, not a label. Use it with your marks, goals and family context. It is for career guidance for ages 17 to 30, not for hiring, admissions or diagnosis.</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="confirmRetake()">${ic("rotate-ccw","↻")} Retake career counselling</button><button class="btn line" onclick="showTab('spec')">How this was worked out</button></div>
 <details class="card"><summary>Counsellor view (raw scores)</summary>
 <div class="tw"><table><tr><th>Interest picks / shown</th>${"RIASEC".split("").map(k=>`<th>${k}</th>`).join("")}</tr><tr><td>Share</td>${"RIASEC".split("").map(k=>`<td class="n">${r.riasec[k].toFixed(2)}</td>`).join("")}</tr></table></div>
 <div class="tw"><table><tr><th>Work style (0-1)</th>${"OCEAN".split("").map(k=>`<th>${k}</th>`).join("")}</tr><tr><td>Score</td>${"OCEAN".split("").map(k=>`<td class="n">${r.big5[k].toFixed(2)}</td>`).join("")}</tr></table></div>
 <p class="fine">Blend ${r.blend} · gap ${r.gap.toFixed(3)} · interest spread ${r.spread.toFixed(2)} · time ${Math.round(st.secs||0)}s</p>
 <div class="tw"><table><tr><th>#</th><th>Profile (KB name)</th><th>Type</th><th>Score</th></tr>${r.ranked.map((id,i)=>`<tr><td class="n">${i+1}</td><td>${PROFILES[id].name}</td><td>${PROFILES[id].type}</td><td class="n">${r.prof[id].toFixed(3)}</td></tr>`).join("")}</table></div>
 <div class="tw"><table><tr><th>Track</th><th>Pathway</th><th>Score</th><th>Adjustments</th></tr>${r.allTracks.slice(0,8).map(x=>`<tr><td>${x.t[2]}</td><td>${PATHWAYS[x.t[1]].name}</td><td class="n">${x.v.toFixed(2)}</td><td>${x.why.join("; ")||"-"}</td></tr>`).join("")}</table></div></details>`;}
function courseBlock(t){const p=coursePlan(t[1],st.bg);
 if(!p)return `<div class="course fine">Course details for this pathway are coming soon.</div>`;
 let ar=ARENA[t[0]]; if(ar&&typeof ar==="object")ar=ar[st.bg.stream]||ar._;
 const slow=p.weeks>p.c.weeks;
 return `<div class="course"><b>${esc(p.c.title)} course</b> · ${p.c.mcs.length} micro-credentials · ${p.c.trainHrs+p.c.assessHrs} hrs · ${p.c.credits} credits
 <div class="fine">${slow?`About ${p.weeks} weeks at your ${PACE[st.bg.weekly]} hrs/week (planned: ${p.c.weeks} weeks at ${p.planned.toFixed(1)} hrs/week).`:`${p.c.weeks} weeks at about ${p.planned.toFixed(1)} hrs/week.`}
 ${!p.fits?` Longer than your timeline: you can finish ${p.mcsInTime||"part of"} ${p.mcsInTime===1?"micro-credential":"micro-credentials"} in time, each one counts on its own.`:""}</div>
 <ol class="mcs">${p.c.mcs.map(m=>`<li${m[0]==="MC2"&&ar||FOCUS_MC[t[0]]===m[0]?' class="hl"':""}><b>${m[0]} ${esc(m[1])}</b>${m[0]==="MC2"&&ar?` <span class="fine">Your area: ${esc(ar)}</span>`:FOCUS_MC[t[0]]===m[0]?' <span class="fine">Core for this track</span>':""}</li>`).join("")}</ol></div>`;}
function confirmRetake(){ $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Retake career counselling?</h2><p class="fine" style="font-size:15px">You'll answer the questions and take the picture test again. Your current answers will be cleared.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn line" onclick="closeM()">Cancel</button><button class="btn" onclick="closeM();st=fresh();save();showTab('test');begin()">Start again</button></div></div></div>`;}
function closeM(){$("#modal").innerHTML="";}
function renderSpec(){
 const T=id=>TRACKS.find(t=>t[0]===id)[2]; const streams=[...QUICK[1].opts.iti,...QUICK[1].opts.college];
 $("#view-spec").innerHTML=`<div class="card spec">
 <h2>Flow</h2><ol><li><b>Quick questions</b> (${QUICK.length}, chat). Picked from the platform flow; used to adjust tracks, not to score the profile.</li><li><b>Part 1: What you enjoy</b> (${INT_Q.length} picture questions, 4 pictures each). Measures RIASEC interests.</li><li><b>Part 2: How you work</b> (${SIT_Q.length} picture situations + ${RATED.length} "sounds like you" sentences). Measures work style.</li><li><b>Report</b>: career type (1 of 13), interests, work style.</li><li><b>3 course tracks</b> from 24 tracks across 4 pathways.</li></ol>
 <h2>Quick questions: kept and dropped</h2><div class="tw"><table><tr><th>Platform question</th><th>Status</th><th>Used for</th></tr>
 <tr><td>Profile check (learner type, course)</td><td>Kept</td><td>Course group boosts tracks linked to the course (+${Math.round(CFG.streamBoost*100)}%)</td></tr>
 <tr><td>Main goal</td><td>Kept</td><td>Stable job: entry-level tracks; Own work: business tracks; Study further: research tracks. Also nudges matching profiles</td></tr>
 <tr><td>Top priority</td><td>Kept</td><td>Job-ready: quick-entry tracks; Portfolio: build-and-show tracks; Practical skills: hands-on tracks; Exploring: one track per pathway</td></tr>
 <tr><td>Computer comfort</td><td>Added</td><td>Rarely use one: coding and data-heavy tracks marked Stretch. Done coding: boosts build tracks</td></tr>
 <tr><td>Weekly time</td><td>Kept</td><td>Converts course hours into weeks at the learner's pace. Display only, does not change the ranking</td></tr>
 <tr><td>Timeline</td><td>Kept</td><td>Flags when a course is longer than the timeline and shows how many micro-credentials fit</td></tr>
 <tr><td>Support needed</td><td>Dropped</td><td>Does not change which track fits</td></tr></table></div>
 <h2>Part 1 design</h2><p>Each question shows 4 of the 6 interest types. Across 12 questions each type appears exactly 8 times, and the never-paired types are hands-on with investigating, creating with helping, leading with organising (so these always compete with other types). Picture positions rotate so no type sits in the same spot. Score per type = times chosen ÷ 8.</p>
 <div class="tw"><table><tr><th>#</th>${[0,1,2,3].map(i=>`<th>Picture ${i+1}</th>`).join("")}</tr>${INT_Q.map((q,i)=>`<tr><td class="n">${i+1}</td>${q.map(o=>`<td>${esc(o.label)} <span class="fine">(${o.k})</span></td>`).join("")}</tr>`).join("")}</table></div>
 <h2>Part 2 design</h2><p>Each situation has 4 choices, one each for Creative thinker (O), Careful and thorough (C), Takes initiative (E) and Team player (A). Score = share of choices × 2, so 0.5 is average. Calm under pressure (N) uses 3 rated sentences, one reverse-worded.</p>
 <div class="tw"><table><tr><th>Situation</th><th>O</th><th>C</th><th>E</th><th>A</th></tr>${SIT_Q.map(q=>`<tr><td>${esc(q.q)}</td>${"OCEA".split("").map(k=>`<td>${esc(q.opts.find(o=>o.k===k).label)}</td>`).join("")}</tr>`).join("")}</table></div>
 <div class="tw"><table><tr><th>Sentence</th><th>Key</th></tr>${RATED.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]?"Reverse (calm)":"Worry"}</td></tr>`).join("")}</table></div>
 <h2>The 13 career types</h2><div class="tw"><table><tr><th>Student-facing type</th><th>KB profile</th><th>RIASEC</th><th>O</th><th>C</th><th>E</th><th>A</th><th>N</th><th>Lead tracks</th></tr>${Object.entries(PROFILES).map(([id,p])=>`<tr><td><b>${p.type}</b></td><td>${p.name}</td><td>${p.code.split("").join(" ")}</td>${"OCEAN".split("").map(k=>`<td>${p.b5[k]}</td>`).join("")}<td>${TRACKS.filter(t=>t[3][0]===id).map(t=>t[2]).join(", ")}</td></tr>`).join("")}</table></div>
 <h2>Tracks and fits</h2><div class="tw"><table><tr><th>Pathway</th><th>Track</th><th>Fit 1 (w3)</th><th>Fit 2 (w2)</th><th>Fit 3 (w1)</th></tr>${TRACKS.map(t=>`<tr><td><span class="dot" style="--c:var(${PATHWAYS[t[1]].color})"></span>${PATHWAYS[t[1]].name}</td><td>${t[2]}</td>${t[3].map(p=>`<td>${PROFILES[p].type}</td>`).join("")}</tr>`).join("")}</table></div>
 <h2>Course data: Applied AI</h2><p>All 6 Applied AI tracks use the same course. MC2 "Apply It Where It Matters" is where the track becomes specific: the learner's chosen area is set from their recommended track (and course group for Sector AI). AI Evaluation & Responsible AI leans on MC3.</p>
 <div class="tw"><table><tr><th>MC</th><th>Title</th><th>Weeks</th><th>Training hrs</th><th>Assessment hrs</th></tr>${COURSES.AI.mcs.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[5]}</td><td class="n">${m[3]}</td><td class="n">${m[4]}</td></tr>`).join("")}<tr><td colspan="3"><b>Total</b> (${COURSES.AI.credits} credits, ${COURSES.AI.segments} segments)</td><td class="n">${COURSES.AI.trainHrs}</td><td class="n">${COURSES.AI.assessHrs}</td></tr></table></div>
 <div class="tw"><table><tr><th>Applied AI track</th><th>MC2 area</th></tr>${Object.entries(ARENA).map(([k,v])=>`<tr><td>${T(k)}</td><td>${typeof v==="object"?"Healthcare / agriculture / technical field work / education and small business, by course group":v}</td></tr>`).join("")}</table></div>
 <p class="fine">Weeks at learner pace = 64 hrs ÷ weekly hours (1.5, 2.5, 4 or 6), never less than the planned 15 weeks.</p>
 <h2>Scoring</h2><ul><li><b>Interest fit</b>: each type's share minus the student's average share, weighted 3, 2, 1 on the profile's top 3 types.</li><li><b>Work-style fit</b>: H rewards high, L low, M middle; Creative thinker counts half.</li><li><b>Profile score</b> = ${CFG.wInterest} × interest + ${CFG.wPersonality} × work style, + ${CFG.motiveBoost} if the main goal matches the profile.</li>
 <li><b>Result type</b>: Exploratory if interest spread under ${CFG.flatInterest} or top score under ${CFG.exploreTop}; Single if the gap between #1 and #2 is ${CFG.singleGap}+; else Adjacent (one of 26 neighbour pairs) or Split-Drive.</li>
 <li><b>Tracks</b>: fit weights × top profiles, × background multipliers; max 2 per pathway (1 if Exploratory or "Just exploring"). Fit shows High when the track leads with the student's top type and scores within 75% of the best track.</li></ul>
 <div class="tw"><table><tr><th>Course group</th><th>Tracks boosted</th></tr>${streams.map(s=>`<tr><td>${s[1]}</td><td>${STREAM_BOOST[s[0]].map(T).join(", ")}</td></tr>`).join("")}</table></div>
 <h2>Quality checks</h2><ul><li>${Math.round(CFG.samePos*100)}%+ of picks in the same picture position, or under ${CFG.minSecPerItem}s per question: report shows a caution and suggests a retake.</li></ul>
 <h2>Validation (simulated, not real students)</h2><ul><li>Students built from one type: correct type first 96-99%, in top two 100%.</li><li>Students mixing two types: both in top two only 26%. Weakest area; more questions would help.</li><li>Random tappers: 67% get Exploratory, not a confident type.</li><li>All 24 tracks get recommended.</li></ul>
 <h2>Limits</h2><ul><li>Picture choices are relative (choosing one means not choosing others), so the test shows what someone prefers most, not absolute levels.</li><li>Pictures are icons for now. Replace with illustrated scenes and add Hindi / Hinglish text and audio before pilot.</li><li>Type definitions, track fits and thresholds are a draft. Validate with counsellors and a pilot of about 300 to 500 learners.</li></ul></div>`;
 icons();}
